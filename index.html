                })}
              </div>
            </div>
          )}

          {/* Project suggestions */}
          {projectSuggestions.length>0&&(
            <div>
              <div style={{fontSize:"0.68rem",color:theme.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Could work on today</div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {projectSuggestions.map(({project:p,step:s},i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:theme.bg,borderRadius:7,borderLeft:`3px solid ${p.color}`}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:"0.7rem",color:p.color,fontWeight:600,marginBottom:1}}>{p.title}</div>
                      <div style={{fontSize:"0.8rem",color:theme.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.title}</div>
                    </div>
                    <div style={{display:"flex",gap:6,flexShrink:0}}>
                      <span style={{fontSize:"0.65rem",color:ENERGY_COLORS[s.energy]}}>{ENERGY_LABELS[s.energy]}</span>
                      <span style={{fontSize:"0.65rem",color:theme.muted}}>⏱{fmtMins(s.mins)}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ─── CALENDAR PANEL ───────────────────────────────────────────────────────────
function CalendarPanel({events,todos,theme,onAdd,onDelete}){
  const today=new Date();
  const [showModal,setShowModal]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);
  const blankForm=d=>({title:"",date:d||todayStr(),time:"",category:"other",notes:""});
  const [form,setForm]=useState(blankForm());
  const openAdd=()=>{setForm(blankForm(selected));setShowModal(true);};
  const saveEvent=()=>{if(!form.title.trim())return;onAdd({...form,id:genId(),title:form.title.trim()});setSelected(form.date);setShowModal(false);};
  const [viewYear,setViewYear]=useState(today.getFullYear());
  const [viewMonth,setViewMonth]=useState(today.getMonth());
  const [selected,setSelected]=useState(todayStr());
  const todayS=todayStr();
  const numDays=daysInMonth(viewYear,viewMonth),firstDay=firstDayOfMonth(viewYear,viewMonth);
  const cells=Array.from({length:firstDay+numDays},(_,i)=>i<firstDay?null:i-firstDay+1);
  while(cells.length%7!==0)cells.push(null);
  const prevMonth=()=>{if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1);};
  const nextMonth=()=>{if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1);};
  const ds=day=>`${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const eventsFor=day=>events.filter(e=>e.date===ds(day));
  const todosFor=day=>todos.filter(t=>t.dueDate===ds(day)&&!t.completed);
  const selEvs=selected?events.filter(e=>e.date===selected):[];
  const selTodos=selected?todos.filter(t=>t.dueDate===selected&&!t.completed):[];
  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="Calendar" accent={theme.accent} action={
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button onClick={openAdd} style={{background:theme.accent,border:"none",borderRadius:6,color:"#000",fontSize:"0.75rem",fontWeight:700,padding:"3px 9px",cursor:"pointer"}}>+ Add</button>
          <button onClick={prevMonth} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",padding:"2px 8px",fontSize:"0.8rem"}}>‹</button>
          <span style={{fontSize:"0.78rem",fontWeight:700,color:theme.text,minWidth:106,textAlign:"center"}}>{MONTHS[viewMonth]} {viewYear}</span>
          <button onClick={nextMonth} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",padding:"2px 8px",fontSize:"0.8rem"}}>›</button>
        </div>
      }/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:"0.62rem",fontWeight:700,color:theme.muted,padding:"2px 0"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {cells.map((day,i)=>{
          if(!day)return <div key={`e${i}`}/>;
          const d=ds(day),isToday=d===todayS,isSel=d===selected;
          const dots=[...eventsFor(day).map(e=>CATEGORY_COLORS[e.category]||"#64748b"),...todosFor(day).map(()=>PRIORITY_COLORS.medium)].slice(0,3);
          return(
            <div key={d} onClick={()=>setSelected(d)} style={{textAlign:"center",padding:"5px 2px 4px",borderRadius:7,cursor:"pointer",background:isSel?theme.accent:isToday?`${theme.accent}22`:"transparent",border:isToday&&!isSel?`1px solid ${theme.accent}`:"1px solid transparent",transition:"background 0.15s"}}>
              <div style={{fontSize:"0.78rem",fontWeight:isToday||isSel?700:400,color:isSel?"#000":isToday?theme.accent:theme.text,lineHeight:1.3}}>{day}</div>
              {dots.length>0&&<div style={{display:"flex",justifyContent:"center",gap:2,marginTop:2}}>{dots.map((c,ci)=><div key={ci} style={{width:4,height:4,borderRadius:"50%",background:isSel?"#000":c}}/>)}</div>}
            </div>
          );
        })}
      </div>
      {selected&&(selEvs.length>0||selTodos.length>0)&&(
        <div style={{marginTop:10,borderTop:`1px solid ${theme.border}`,paddingTop:10}}>
          <div style={{fontSize:"0.72rem",color:theme.muted,marginBottom:6,fontWeight:600}}>{formatDate(selected)}</div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {selEvs.map(ev=>(
              <div key={ev.id} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 8px",background:theme.bg,borderRadius:6,borderLeft:`3px solid ${CATEGORY_COLORS[ev.category]||"#64748b"}`}}>
                <span>{CATEGORY_ICONS[ev.category]||"📌"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:"0.8rem",fontWeight:600,color:theme.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.title}</div>
                  {(ev.time||ev.notes)&&<div style={{fontSize:"0.68rem",color:theme.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{[ev.time&&formatTime(ev.time),ev.notes].filter(Boolean).join(" · ")}</div>}
                </div>
                <span style={{fontSize:"0.62rem",padding:"1px 5px",borderRadius:4,background:`${CATEGORY_COLORS[ev.category]}22`,color:CATEGORY_COLORS[ev.category],textTransform:"capitalize",flexShrink:0}}>{ev.category}</span>
                {confirmDel===ev.id
                  ? <button onClick={()=>{onDelete(ev.id);setConfirmDel(null);}} style={{background:"#ef4444",border:"none",borderRadius:5,color:"#fff",cursor:"pointer",fontSize:"0.65rem",fontWeight:700,padding:"2px 6px",flexShrink:0}}>Delete</button>
                  : <button onClick={()=>setConfirmDel(ev.id)} title="Delete event" style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.8rem",opacity:0.5,flexShrink:0,padding:0}}>✕</button>}
              </div>
            ))}
            {selTodos.map(t=>(
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 8px",background:theme.bg,borderRadius:6,borderLeft:`3px solid ${PRIORITY_COLORS[t.priority]}`}}>
                <span>✅</span>
                <div style={{flex:1,fontSize:"0.8rem",color:theme.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</div>
                <span style={{fontSize:"0.62rem",padding:"1px 5px",borderRadius:4,background:`${PRIORITY_COLORS[t.priority]}22`,color:PRIORITY_COLORS[t.priority],textTransform:"capitalize",flexShrink:0}}>{t.priority}</span>
              </div>
            ))}
          </div>
        </div>
      )}
      {selected&&selEvs.length===0&&selTodos.length===0&&(
        <div style={{marginTop:8,borderTop:`1px solid ${theme.border}`,paddingTop:8,fontSize:"0.75rem",color:theme.muted,textAlign:"center"}}>Nothing on {formatDate(selected)}</div>
      )}
      {showModal&&(
        <Modal title="Add Event" onClose={()=>setShowModal(false)} theme={theme}>
          <Inp label="Title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Pilots game vs. Tigers"/>
          <Inp label="Date" type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
          <Inp label="Time (optional)" type="time" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}/>
          <Inp label="Category" as="select" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
            {Object.keys(CATEGORY_COLORS).map(c=><option key={c} value={c}>{CATEGORY_ICONS[c]} {c.charAt(0).toUpperCase()+c.slice(1)}</option>)}
          </Inp>
          <Inp label="Notes (optional)" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Location, details…"/>
          <button onClick={saveEvent} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.9rem",marginTop:4}}>Save Event</button>
        </Modal>
      )}
      <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:"5px 10px"}}>
        {Object.entries(CATEGORY_COLORS).map(([k,c])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:c}}/>
            <span style={{fontSize:"0.63rem",color:theme.muted,textTransform:"capitalize"}}>{k}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── TODO PANEL ───────────────────────────────────────────────────────────────
function TodoPanel({todos,blocking,theme,onAdd,onToggle,onDelete}){
  const [showModal,setShowModal]=useState(false);
  const [form,setForm]=useState({title:"",priority:"medium",dueDate:"",dueTime:""});
  const [filter,setFilter]=useState("active");
  const filtered=todos.filter(t=>filter==="all"?true:filter==="active"?!t.completed:t.completed)
    .sort((a,b)=>{const po={high:0,medium:1,low:2};if(a.completed!==b.completed)return a.completed?1:-1;return(po[a.priority]||1)-(po[b.priority]||1);});
  const save=()=>{if(!form.title.trim())return;onAdd({...form,id:genId(),title:form.title.trim(),completed:false});setForm({title:"",priority:"medium",dueDate:"",dueTime:""});setShowModal(false);};
  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="To-Do" accent={theme.accent} action={
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <div style={{display:"flex",gap:2,background:theme.bg,borderRadius:6,padding:2}}>
            {["active","completed","all"].map(f=>(
              <button key={f} onClick={()=>setFilter(f)} style={{background:filter===f?theme.accent:"none",border:"none",borderRadius:4,padding:"2px 7px",fontSize:"0.63rem",color:filter===f?"#000":theme.muted,cursor:"pointer",fontWeight:filter===f?700:400,textTransform:"capitalize"}}>{f}</button>
            ))}
          </div>
          <button onClick={()=>setShowModal(true)} style={{background:theme.accent,border:"none",borderRadius:6,color:"#000",fontSize:"0.75rem",fontWeight:700,padding:"4px 10px",cursor:"pointer"}}>+ Add</button>
        </div>
      }/>
      {filtered.length===0?<p style={{color:theme.muted,fontSize:"0.8rem",textAlign:"center",padding:"8px 0"}}>{QUIPS.emptyTodo}</p>:(
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {filtered.map(t=>(
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 8px",background:theme.bg,borderRadius:7,opacity:t.completed?0.5:1,borderLeft:`3px solid ${PRIORITY_COLORS[t.priority]}`}}>
              <button onClick={()=>onToggle(t.id)} style={{width:18,height:18,border:`2px solid ${t.completed?theme.accent:theme.muted}`,borderRadius:4,background:t.completed?theme.accent:"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#000",fontSize:"0.7rem",padding:0}}>{t.completed?"✓":""}</button>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:"0.85rem",color:theme.text,textDecoration:t.completed?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{blocking?.["todo:"+t.id]&&<span title="Needed for today's Daily Unlock" style={{marginRight:5}}>🔒</span>}{t.title}</div>
                {(t.dueDate||t.dueTime)&&<div style={{fontSize:"0.7rem",color:theme.muted}}>{t.dueDate?formatDate(t.dueDate):""}{t.dueTime?` ${formatTime(t.dueTime)}`:""}</div>}
              </div>
              <span style={{fontSize:"0.63rem",padding:"2px 6px",borderRadius:4,background:`${PRIORITY_COLORS[t.priority]}22`,color:PRIORITY_COLORS[t.priority],textTransform:"capitalize",flexShrink:0}}>{t.priority}</span>
              <button onClick={()=>onDelete(t.id)} style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.8rem",opacity:0.5,flexShrink:0}}>✕</button>
            </div>
          ))}
        </div>
      )}
      {showModal&&(
        <Modal title="Add Task" onClose={()=>setShowModal(false)} theme={theme}>
          <Inp label="Task" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="What needs to be done?"/>
          <Inp label="Priority" as="select" value={form.priority} onChange={e=>setForm({...form,priority:e.target.value})}>
            <option value="high">🔴 High</option><option value="medium">🟠 Medium</option><option value="low">🔵 Low</option>
          </Inp>
          <Inp label="Due Date (optional)" type="date" value={form.dueDate} onChange={e=>setForm({...form,dueDate:e.target.value})}/>
          <Inp label="Due Time (optional)" type="time" value={form.dueTime} onChange={e=>setForm({...form,dueTime:e.target.value})}/>
          <button onClick={save} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.9rem",marginTop:4}}>Save Task</button>
        </Modal>
      )}
    </div>
  );
}

// ─── HABITS PANEL ─────────────────────────────────────────────────────────────
// ─── MONTHLY REVIEW MODAL ────────────────────────────────────────────────────
function MonthlyReviewModal({habits, theme, startDate, onClose, onSetGoal}){
  const [reviewLine]=useState(()=>pick(QUIPS.monthlyReview));
  const mk=monthKey();
  const prevMk=prevMonthKey(mk);
  const lastYearMk=sameMonthLastYearKey(mk);
  const now=new Date();
  const monthName=MONTHS[now.getMonth()];
  const [goals,setGoals]=useState(()=>{
    const g={};
    habits.forEach(h=>{g[h.id]=getHabitGoal(h,mk);});
    return g;
  });

  const rows=habits.map(h=>{
    const prevRate=calcHabitMonthRate(h,prevMk,startDate);
    const lyRate=calcHabitMonthRate(h,lastYearMk,startDate);
    const suggested=calcGoalForHabit(h,mk);
    return{h,prevRate,lyRate,suggested,goal:goals[h.id]??suggested};
  });

  const save=()=>{
    onSetGoal(goals);
    onClose();
  };

  const barColor=(rate,goal)=>{
    if(rate===null)return"#334155";
    if(rate>=goal)return"#22c55e";
    if(rate>=goal*0.8)return"#f59e0b";
    return"#ef4444";
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:3000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:theme.panel,border:`1.5px solid ${theme.accent}`,borderRadius:14,padding:20,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:"1.4rem",marginBottom:4}}>📊</div>
          <div style={{fontSize:"1.1rem",fontWeight:800,color:theme.accent}}>Monthly Goal Review</div>
          <div style={{fontSize:"0.8rem",color:theme.muted,marginTop:4}}>{reviewLine}</div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
          {rows.map(({h,prevRate,lyRate,suggested,goal})=>{
            const curRate=calcHabitMonthRate(h,mk);
            const daysElapsed=daysElapsedInMonth(mk);
            const daysTotal=daysInMonthFromKey(mk);
            return(
              <div key={h.id} style={{background:theme.bg,borderRadius:10,padding:"12px 14px",border:`1px solid ${theme.border}`}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{fontSize:"0.88rem",fontWeight:700,color:theme.text}}>{h.title}</span>
                  {curRate!==null&&(
                    <span style={{fontSize:"0.72rem",color:barColor(curRate,goal),fontWeight:700}}>{curRate}% so far</span>
                  )}
                </div>

                {/* Comparison row */}
                <div style={{display:"flex",gap:8,marginBottom:10}}>
                  {[
                    {label:"Last month",val:prevRate,mk:prevMk},
                    {label:"Same month last year",val:lyRate,mk:lastYearMk},
                    {label:`${monthName} so far`,val:curRate,mk:mk,current:true},
                  ].map(({label,val,current})=>(
                    <div key={label} style={{flex:1,background:theme.panel,borderRadius:7,padding:"6px 8px",textAlign:"center",border:current?`1px solid ${theme.accent}44`:"none"}}>
                      <div style={{fontSize:"0.62rem",color:theme.muted,marginBottom:3,lineHeight:1.3}}>{label}</div>
                      {val===null
                        ?<div style={{fontSize:"0.75rem",color:theme.muted}}>—</div>
                        :<div style={{fontSize:"0.95rem",fontWeight:700,color:barColor(val,goal)}}>{val}%</div>
                      }
                    </div>
                  ))}
                </div>

                {/* Goal setter */}
                <div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:"0.7rem",color:theme.muted}}>{monthName} goal</span>
                    <span style={{fontSize:"0.78rem",fontWeight:700,color:theme.accent}}>{goals[h.id]??suggested}%</span>
                  </div>
                  <input type="range" min={10} max={100} step={1}
                    value={goals[h.id]??suggested}
                    onChange={e=>setGoals(g=>({...g,[h.id]:Number(e.target.value)}))}
                    style={{width:"100%",accentColor:theme.accent}}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.62rem",color:theme.muted}}>
                    <span>10%</span>
                    <span style={{color:"#facc15"}}>
                      {h.weeklyTarget?`Target: ${h.weeklyTarget}x/week`:`Suggested: ${suggested}%${suggested===69?" 👀":""}`}
                    </span>
                    <span>100%</span>
                  </div>
                </div>

                {/* Progress bar for current month */}
                {curRate!==null&&(
                  <div style={{marginTop:8}}>
                    <div style={{height:5,background:theme.panel,borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",background:barColor(curRate,goals[h.id]??suggested),borderRadius:4,width:`${Math.min(100,curRate)}%`,transition:"width 0.4s"}}/>
                    </div>
                    <div style={{fontSize:"0.62rem",color:theme.muted,marginTop:2,textAlign:"right"}}>{daysElapsed}/{daysTotal} days tracked</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <button onClick={save} style={{width:"100%",background:theme.accent,border:"none",borderRadius:9,padding:"11px",color:"#000",fontWeight:800,cursor:"pointer",fontSize:"0.9rem"}}>
          Lock In Goals 🔒
        </button>
        <button onClick={onClose} style={{width:"100%",background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.75rem",marginTop:8,padding:"4px"}}>
          Not now — remind me later
        </button>
      </div>
    </div>
  );
}

function HabitsPanel({habits,blocking,theme,startDate,onAdd,onToggleDay,onDelete,onSetGoals}){
  const [showModal,setShowModal]=useState(false);
  const [openDetail,setOpenDetail]=useState(null);
  const [showReview,setShowReview]=useState(false);
  const [form,setForm]=useState({title:"",frequency:"daily",daysOfWeek:[0,1,2,3,4,5,6],weeklyTarget:null});
  const today=todayStr(),todayDow=new Date().getDay();
  const relevant=habits.filter(h=>isHabitScheduled(h,today));
  const doneToday=relevant.filter(h=>h.completions?.[today]).length;
  const save=()=>{if(!form.title.trim())return;onAdd({...form,id:genId(),title:form.title.trim(),completions:{},monthlyGoals:{},weeklyTarget:form.weeklyTarget||null});setForm({title:"",frequency:"daily",daysOfWeek:[0,1,2,3,4,5,6]});setShowModal(false);};
  const toggleDow=dow=>setForm(f=>({...f,daysOfWeek:f.daysOfWeek.includes(dow)?f.daysOfWeek.filter(d=>d!==dow):[...f.daysOfWeek,dow]}));
  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title={`Daily Habits · ${doneToday}/${relevant.length}`} accent={theme.accent} action={
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setShowReview(true)} style={{background:`${theme.accent}22`,border:`1px solid ${theme.accent}44`,borderRadius:6,color:theme.accent,fontSize:"0.72rem",fontWeight:700,padding:"4px 8px",cursor:"pointer"}}>📊 Goals</button>
          <button onClick={()=>setShowModal(true)} style={{background:theme.accent,border:"none",borderRadius:6,color:"#000",fontSize:"0.75rem",fontWeight:700,padding:"4px 10px",cursor:"pointer"}}>+ Add</button>
        </div>
      }/>
      <div style={{height:4,background:theme.bg,borderRadius:4,marginBottom:10}}>
        <div style={{height:"100%",background:theme.accent,borderRadius:4,width:relevant.length?`${(doneToday/relevant.length)*100}%`:"0%",transition:"width 0.4s"}}/>
      </div>
      {/* Monthly goal progress per habit */}
      {relevant.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:3,marginBottom:8}}>
          {relevant.map(h=>{
            const mk=monthKey();
            const goal=getHabitGoal(h,mk);
            const rate=calcHabitMonthRate(h,mk,startDate)??0;
            const color=rate>=goal?"#22c55e":rate>=goal*0.8?"#f59e0b":"#ef4444";
            return(
              <div key={h.id+"-goal"} style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:110,flexShrink:0}}>
                  <div style={{fontSize:"0.62rem",color:theme.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.title}</div>
                  {h.weeklyTarget&&<div style={{fontSize:"0.55rem",color:theme.muted,opacity:0.7}}>goal: {h.weeklyTarget}x/wk</div>}
                </div>
                <div style={{flex:1,height:4,background:theme.bg,borderRadius:4}}>
                  <div style={{height:"100%",background:color,borderRadius:4,width:`${Math.min(100,rate)}%`,transition:"width 0.4s"}}/>
                </div>
                <span style={{fontSize:"0.62rem",color:color,width:56,textAlign:"right",flexShrink:0}}>
                  {h.weeklyTarget
                    ? `${rate}%`
                    : `${rate}%/${goal}%`}
                </span>
              </div>
            );
          })}
        </div>
      )}
      {relevant.length===0?<p style={{color:theme.muted,fontSize:"0.8rem",textAlign:"center",padding:"8px 0"}}>{QUIPS.emptyHabit}</p>:(
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {relevant.map(h=>{const done=!!h.completions?.[today];return(
            <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 8px",background:theme.bg,borderRadius:7}}>
              <button onClick={()=>onToggleDay(h.id,today)} style={{width:22,height:22,border:`2px solid ${done?theme.accent:theme.muted}`,borderRadius:6,background:done?theme.accent:"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#000",fontSize:"0.8rem",fontWeight:700,padding:0,transition:"all 0.2s"}}>{done?"✓":""}</button>
              <div style={{flex:1,minWidth:0,cursor:h.detail?"pointer":"default"}} onClick={()=>h.detail&&setOpenDetail(o=>o===h.id?null:h.id)}>
                <div style={{fontSize:"0.85rem",color:theme.text,textDecoration:done?"line-through":"none",opacity:done?0.5:1}}>
                  {blocking?.["habit:"+h.id]&&<span title="Needed for today's Daily Unlock" style={{marginRight:5}}>🔒</span>}{h.track==="spanish-clinical"&&<span style={{marginRight:5}}>🇪🇸</span>}{h.title}
                </div>
                {blocking?.["habit:"+h.id]?.note&&<div style={{fontSize:"0.62rem",color:theme.muted}}>{blocking["habit:"+h.id].note} · needed today</div>}
                {(h.durationMin||h.reminderTime)&&<div style={{fontSize:"0.62rem",color:theme.muted,opacity:done?0.5:1}}>
                  {[h.durationMin&&fmtMins(h.durationMin), h.reminderTime&&("⏰ "+formatTime(h.reminderTime))].filter(Boolean).join(" · ")}
                </div>}
                {openDetail===h.id&&<div style={{fontSize:"0.7rem",color:theme.muted,marginTop:4,lineHeight:1.4}}>{h.detail}</div>}
              </div>
              <span style={{fontSize:"0.63rem",color:theme.muted,flexShrink:0}}>{h.frequency==="daily"?"Daily":h.daysOfWeek?.map(d=>DAYS[d]).join(" ")}</span>
              <button onClick={()=>onDelete(h.id)} style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.8rem",opacity:0.5,flexShrink:0}}>✕</button>
            </div>
          );})}
        </div>
      )}
      {showReview&&(
        <MonthlyReviewModal habits={habits} theme={theme} startDate={startDate}
          onClose={()=>setShowReview(false)}
          onSetGoal={goals=>{
            const updated=habits.map(h=>({...h,monthlyGoals:{...h.monthlyGoals||{},[monthKey()]:goals[h.id]}}));
            onSetGoals(updated);
          }}
        />
      )}
      {showModal&&(
        <Modal title="Add Habit" onClose={()=>setShowModal(false)} theme={theme}>
          <Inp label="Habit Name" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Stretch before bed"/>
          <Inp label="Frequency" as="select" value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})}>
            <option value="daily">Daily</option><option value="weekly">Specific Days</option>
          </Inp>
          {form.frequency==="weekly"&&(
            <div style={{marginBottom:12}}>
              <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Days</label>
              <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                {DAYS.map((d,i)=><button key={i} onClick={()=>toggleDow(i)} style={{padding:"4px 8px",borderRadius:6,border:`1px solid ${form.daysOfWeek.includes(i)?theme.accent:theme.border}`,background:form.daysOfWeek.includes(i)?`${theme.accent}22`:"transparent",color:form.daysOfWeek.includes(i)?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.75rem"}}>{d}</button>)}
              </div>
            </div>
          )}
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Weekly Target (optional)</label>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{display:"flex",gap:4}}>
                {[null,1,2,3,4,5,6,7].map(n=>(
                  <button key={String(n)} onClick={()=>setForm(f=>({...f,weeklyTarget:n}))}
                    style={{padding:"4px 8px",borderRadius:6,border:`1.5px solid ${form.weeklyTarget===n?theme.accent:theme.border}`,background:form.weeklyTarget===n?`${theme.accent}22`:"transparent",color:form.weeklyTarget===n?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.73rem",fontWeight:form.weeklyTarget===n?700:400}}>
                    {n===null?"Any":n+"x"}
                  </button>
                ))}
              </div>
            </div>
            {form.weeklyTarget&&<div style={{fontSize:"0.68rem",color:theme.muted,marginTop:4}}>Goal: hit this habit {form.weeklyTarget}x per week</div>}
          </div>
          <button onClick={save} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.9rem",marginTop:4}}>Save Habit</button>
        </Modal>
      )}
    </div>
  );
}

// ─── STEP EDITOR ─────────────────────────────────────────────────────────────
function StepEditor({steps,type,theme,onChange}){
  const addStep=()=>onChange([...steps,{id:genId(),title:"",energy:"medium",mins:30,done:false,notes:""}]);
  const update=(id,f,v)=>onChange(steps.map(s=>s.id===id?{...s,[f]:v}:s));
  const remove=id=>onChange(steps.filter(s=>s.id!==id));
  const move=(idx,dir)=>{const a=[...steps],t=idx+dir;if(t<0||t>=a.length)return;[a[idx],a[t]]=[a[t],a[idx]];onChange(a);};
  return(
    <div style={{marginBottom:12}}>
      <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>{type==="linear"?"Steps (ordered)":"Tasks (any order)"}</label>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {steps.map((s,idx)=>(
          <div key={s.id} style={{background:theme.bg,borderRadius:8,padding:"10px",border:`1px solid ${theme.border}`}}>
            <div style={{display:"flex",gap:6,marginBottom:6}}>
              {type==="linear"&&(
                <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                  <button onClick={()=>move(idx,-1)} disabled={idx===0} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:4,color:theme.muted,cursor:idx===0?"not-allowed":"pointer",fontSize:"0.65rem",padding:"0 5px",opacity:idx===0?0.3:1}}>▲</button>
                  <button onClick={()=>move(idx,1)} disabled={idx===steps.length-1} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:4,color:theme.muted,cursor:idx===steps.length-1?"not-allowed":"pointer",fontSize:"0.65rem",padding:"0 5px",opacity:idx===steps.length-1?0.3:1}}>▼</button>
                </div>
              )}
              <input value={s.title} onChange={e=>update(s.id,"title",e.target.value)} placeholder={`Step ${idx+1}…`}
                style={{flex:1,background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:6,padding:"6px 8px",color:"#e2e8f0",fontSize:"0.82rem",minWidth:0}}/>
              <button onClick={()=>remove(s.id)} style={{background:"none",border:"none",color:"#64748b",cursor:"pointer",fontSize:"0.9rem",flexShrink:0,padding:"0 4px"}}>✕</button>
            </div>
            <div style={{display:"flex",gap:6}}>
              <select value={s.energy} onChange={e=>update(s.id,"energy",e.target.value)}
                style={{flex:1,background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:6,padding:"5px 6px",color:ENERGY_COLORS[s.energy],fontSize:"0.75rem"}}>
                <option value="low">🔵 Low effort</option>
                <option value="medium">🟠 Moderate</option>
                <option value="high">🔴 High focus</option>
              </select>
              <select value={s.mins} onChange={e=>update(s.id,"mins",Number(e.target.value))}
                style={{flex:1,background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:6,padding:"5px 6px",color:"#e2e8f0",fontSize:"0.75rem"}}>
                {TIME_SLOTS.map(t=><option key={t} value={t}>{fmtMins(t)}</option>)}
              </select>
            </div>
          </div>
        ))}
        <button onClick={addStep} style={{background:"transparent",border:`1px dashed ${theme.border}`,borderRadius:8,padding:"8px",color:theme.muted,cursor:"pointer",fontSize:"0.8rem",textAlign:"center"}}>+ Add step</button>
      </div>
    </div>
  );
}

// ─── WHAT CAN I DO ────────────────────────────────────────────────────────────
function WhatCanIDoModal({projects,theme,onClose,onAddToTodo}){
  const [availMins,setAvailMins]=useState(60);
  const active=projects.filter(p=>p.status==="active");
  const suggestions=active.flatMap(p=>{
    if(p.type==="linear"){const next=p.steps.find(s=>!s.done);return next&&next.mins<=availMins?[{project:p,step:next,isNext:true}]:[];}
    return p.steps.filter(s=>!s.done&&s.mins<=availMins).map(s=>({project:p,step:s,isNext:false}));
  }).sort((a,b)=>a.step.mins-b.step.mins);
  const low=suggestions.filter(s=>s.step.energy==="low"),med=suggestions.filter(s=>s.step.energy==="medium"),hi=suggestions.filter(s=>s.step.energy==="high");
  const Card=({item})=>(
    <div style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",background:theme.bg,borderRadius:8,borderLeft:`3px solid ${item.project.color||theme.accent}`}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
          <span style={{fontSize:"0.7rem",fontWeight:700,color:item.project.color||theme.accent,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.project.title}</span>
          {item.isNext&&<span style={{fontSize:"0.6rem",background:`${theme.accent}22`,color:theme.accent,padding:"1px 5px",borderRadius:4,flexShrink:0}}>NEXT</span>}
        </div>
        <div style={{fontSize:"0.83rem",color:theme.text,marginBottom:4,lineHeight:1.35}}>{item.step.title}</div>
        <div style={{display:"flex",gap:8}}>
          <span style={{fontSize:"0.68rem",color:ENERGY_COLORS[item.step.energy]}}>{ENERGY_LABELS[item.step.energy]}</span>
          <span style={{fontSize:"0.68rem",color:theme.muted}}>⏱ {fmtMins(item.step.mins)}</span>
        </div>
      </div>
      <button onClick={()=>onAddToTodo({id:genId(),title:`[${item.project.title}] ${item.step.title}`,priority:"medium",dueDate:"",dueTime:"",completed:false})}
        style={{background:item.project.color||theme.accent,border:"none",borderRadius:6,padding:"5px 10px",color:"#000",fontSize:"0.72rem",fontWeight:700,cursor:"pointer",flexShrink:0}}>+ To-Do</button>
    </div>
  );
  const Sec=({label,items})=>items.length===0?null:(
    <div style={{marginBottom:14}}>
      <div style={{fontSize:"0.7rem",fontWeight:700,color:theme.muted,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>{label}</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>{items.map((item,i)=><Card key={i} item={item}/>)}</div>
    </div>
  );
  return(
    <Modal title="What can I work on?" onClose={onClose} theme={theme}>
      <div style={{marginBottom:16}}>
        <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:8}}>How much free time?</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {[15,30,45,60,90,120].map(m=>(
            <button key={m} onClick={()=>setAvailMins(m)} style={{padding:"6px 12px",borderRadius:7,border:`1.5px solid ${availMins===m?theme.accent:theme.border}`,background:availMins===m?`${theme.accent}22`:"transparent",color:availMins===m?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.78rem",fontWeight:availMins===m?700:400}}>{fmtMins(m)}</button>
          ))}
        </div>
      </div>
      {suggestions.length===0
        ?<div style={{textAlign:"center",padding:"20px 0",color:theme.muted,fontSize:"0.85rem"}}>No steps fit in {fmtMins(availMins)}.<br/>Try a longer window.</div>
        :<><Sec label="Low effort — just get it done" items={low}/><Sec label="Moderate effort" items={med}/><Sec label="High focus — bring your A-game" items={hi}/></>}
    </Modal>
  );
}

// ─── PROJECTS PANEL ───────────────────────────────────────────────────────────
function ProjectsPanel({projects,habits,theme,onSave,onDeleteProject,onMarkStepDone,onAddToTodo}){
  const [expanded,setExpanded]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [showEdit,setShowEdit]=useState(null);
  const [showWhat,setShowWhat]=useState(false);
  const [form,setForm]=useState({title:"",description:"",type:"linear",color:PROJECT_COLORS[0],status:"active",steps:[]});
  const active=projects.filter(p=>p.status==="active"),paused=projects.filter(p=>p.status==="paused"),done=projects.filter(p=>p.status==="complete");
  const openNew=()=>{setForm({title:"",description:"",type:"linear",color:PROJECT_COLORS[Math.floor(Math.random()*PROJECT_COLORS.length)],status:"active",nudgeDays:null,steps:[]});setShowNew(true);setShowEdit(null);};
  const openEdit=p=>{setForm({...p,nudgeDays:p.nudgeDays||null,steps:[...p.steps.map(s=>({...s}))]});setShowEdit(p.id);setShowNew(false);};
  const saveForm=()=>{
    if(!form.title.trim())return;
    if(showEdit){onSave(projects.map(p=>p.id===showEdit?{...form,id:p.id}:p));setShowEdit(null);}
    else{onSave([...projects,{...form,id:genId(),createdAt:todayStr()}]);setShowNew(false);}
  };
  const progressOf=p=>!p.steps.length?0:Math.round((p.steps.filter(s=>s.done).length/p.steps.length)*100);
  const nextStepOf=p=>p.type==="linear"?p.steps.find(s=>!s.done)||null:p.steps.filter(s=>!s.done)[0]||null;

  const FormContent=()=>(
    <>
      <Inp label="Project Name" value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Learn Spanish"/>
      <Inp label="Description (optional)" as="textarea" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="What is this about?"/>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Color</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{PROJECT_COLORS.map(c=><button key={c} onClick={()=>setForm({...form,color:c})} style={{width:24,height:24,borderRadius:"50%",background:c,border:`3px solid ${form.color===c?"#fff":"transparent"}`,cursor:"pointer",padding:0}}/>)}</div>
      </div>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Type</label>
        <div style={{display:"flex",gap:6}}>
          {[["linear","📋 Linear"],["flexible","🎯 Flexible"]].map(([v,l])=>(
            <button key={v} onClick={()=>setForm({...form,type:v})} style={{flex:1,padding:"8px 6px",borderRadius:7,border:`1.5px solid ${form.type===v?theme.accent:theme.border}`,background:form.type===v?`${theme.accent}11`:"transparent",color:form.type===v?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.78rem",textAlign:"center"}}>{l}</button>
          ))}
        </div>
      </div>
      <Inp label="Status" as="select" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
        <option value="active">Active</option><option value="paused">Paused</option><option value="complete">Complete</option>
      </Inp>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Inactivity Nudge</label>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <div style={{display:"flex",gap:4}}>
            {[null,2,3,5,7,14].map(d=>(
              <button key={String(d)} onClick={()=>setForm({...form,nudgeDays:d})}
                style={{padding:"5px 9px",borderRadius:6,border:`1.5px solid ${form.nudgeDays===d?theme.accent:theme.border}`,background:form.nudgeDays===d?`${theme.accent}22`:"transparent",color:form.nudgeDays===d?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.73rem",fontWeight:form.nudgeDays===d?700:400}}>
                {d===null?"Off":`${d}d`}
              </button>
            ))}
          </div>
        </div>
        {form.nudgeDays&&<div style={{fontSize:"0.68rem",color:theme.muted,marginTop:4}}>Reminder fires if no progress for {form.nudgeDays} days</div>}
      </div>
      {(habits||[]).length>0&&(
        <div style={{marginBottom:12}}>
          <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Habits that count as progress</label>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {(habits||[]).map(h=>{
              const auto=linkedHabits({...form,habitIds:[]},habits).some(x=>x.id===h.id);
              const on=auto||(form.habitIds||[]).includes(h.id);
              return(
                <button key={h.id} disabled={auto} title={auto?"Linked automatically":""}
                  onClick={()=>setForm(f=>{const ids=f.habitIds||[];return {...f,habitIds:ids.includes(h.id)?ids.filter(x=>x!==h.id):[...ids,h.id]};})}
                  style={{padding:"4px 8px",borderRadius:6,border:`1.5px solid ${on?theme.accent:theme.border}`,background:on?`${theme.accent}22`:"transparent",color:on?theme.accent:theme.muted,cursor:auto?"default":"pointer",fontSize:"0.72rem",fontWeight:on?700:400,opacity:auto?0.8:1}}>
                  {h.track==="spanish-clinical"?"🇪🇸 ":""}{h.title}
                </button>
              );
            })}
          </div>
          <div style={{fontSize:"0.68rem",color:theme.muted,marginTop:4}}>Checking off a linked habit resets this project's nudge timer</div>
        </div>
      )}
      <StepEditor steps={form.steps} type={form.type} theme={theme} onChange={steps=>setForm({...form,steps})}/>
      <button onClick={saveForm} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.9rem",marginTop:4}}>{showEdit?"Save Changes":"Create Project"}</button>
    </>
  );

  const ProjectCard=({p})=>{
    const pct=progressOf(p),next=nextStepOf(p),isOpen=expanded===p.id,remaining=p.steps.filter(s=>!s.done).length;
    return(
      <div style={{background:theme.bg,borderRadius:9,border:`1px solid ${theme.border}`,overflow:"hidden"}}>
        <div onClick={()=>setExpanded(isOpen?null:p.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",cursor:"pointer"}}>
          <div style={{width:10,height:10,borderRadius:"50%",background:p.color,flexShrink:0}}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:"0.88rem",fontWeight:700,color:theme.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.title}</span>
              <span style={{fontSize:"0.63rem",padding:"1px 6px",borderRadius:4,background:p.status==="active"?`${theme.accent}22`:p.status==="paused"?"#f9741622":"#22c55e22",color:p.status==="active"?theme.accent:p.status==="paused"?"#f97416":"#22c55e",flexShrink:0,textTransform:"capitalize"}}>{p.status}</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4}}>
              <div style={{flex:1,height:4,background:theme.panel,borderRadius:4}}><div style={{height:"100%",background:p.color,borderRadius:4,width:`${pct}%`,transition:"width 0.4s"}}/></div>
              <span style={{fontSize:"0.68rem",color:theme.muted,flexShrink:0}}>{pct}% · {remaining} left</span>
            </div>
          </div>
          <button onClick={e=>{e.stopPropagation();openEdit(p);}} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.7rem",padding:"3px 7px",flexShrink:0}}>Edit</button>
          <span style={{color:theme.muted,fontSize:"0.8rem",flexShrink:0}}>{isOpen?"▲":"▼"}</span>
        </div>
        {!isOpen&&next&&p.status==="active"&&(
          <div style={{padding:"0 12px 10px",display:"flex",alignItems:"center",gap:8}}>
            <div style={{flex:1,padding:"7px 10px",background:theme.panel,borderRadius:7,borderLeft:`2px solid ${p.color}`}}>
              <div style={{fontSize:"0.7rem",color:theme.muted,marginBottom:2}}>Next up</div>
              <div style={{fontSize:"0.8rem",color:theme.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{next.title}</div>
              <div style={{display:"flex",gap:8,marginTop:3}}>
                <span style={{fontSize:"0.66rem",color:ENERGY_COLORS[next.energy]}}>{ENERGY_LABELS[next.energy]}</span>
                <span style={{fontSize:"0.66rem",color:theme.muted}}>⏱ {fmtMins(next.mins)}</span>
              </div>
            </div>
            <button onClick={()=>onMarkStepDone(p.id,next.id)} style={{background:p.color,border:"none",borderRadius:7,padding:"8px 10px",color:"#000",fontSize:"0.72rem",fontWeight:700,cursor:"pointer",flexShrink:0,lineHeight:1.3,textAlign:"center"}}>Mark<br/>Done</button>
          </div>
        )}
        {isOpen&&(
          <div style={{padding:"0 12px 12px"}}>
            {p.description&&<div style={{fontSize:"0.78rem",color:theme.muted,marginBottom:10,fontStyle:"italic"}}>{p.description}</div>}
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {p.steps.map((s,idx)=>{
                const isNext=p.type==="linear"&&!s.done&&p.steps.slice(0,idx).every(prev=>prev.done);
                const locked=p.type==="linear"&&!s.done&&idx>0&&!p.steps[idx-1].done;
                return(
                  <div key={s.id} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 10px",background:theme.panel,borderRadius:7,opacity:locked?0.4:1,borderLeft:`2px solid ${s.done?"#22c55e":isNext?p.color:theme.border}`}}>
                    <button onClick={()=>!locked&&onMarkStepDone(p.id,s.id)} disabled={locked||s.done}
                      style={{width:20,height:20,border:`2px solid ${s.done?"#22c55e":isNext?p.color:theme.muted}`,borderRadius:5,background:s.done?"#22c55e":"transparent",cursor:locked||s.done?"default":"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#000",fontSize:"0.75rem",fontWeight:700,padding:0,marginTop:1}}>
                      {s.done?"✓":""}
                    </button>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:"0.82rem",color:s.done?theme.muted:theme.text,textDecoration:s.done?"line-through":"none",lineHeight:1.35}}>{s.title}</div>
                      <div style={{display:"flex",gap:8,marginTop:3}}>
                        <span style={{fontSize:"0.66rem",color:s.done?theme.muted:ENERGY_COLORS[s.energy]}}>{ENERGY_LABELS[s.energy]}</span>
                        <span style={{fontSize:"0.66rem",color:theme.muted}}>⏱ {fmtMins(s.mins)}</span>
                        {isNext&&<span style={{fontSize:"0.62rem",background:`${p.color}22`,color:p.color,padding:"1px 5px",borderRadius:4}}>NEXT</span>}
                        {locked&&<span style={{fontSize:"0.62rem",color:theme.muted}}>🔒 Complete previous first</span>}
                      </div>
                    </div>
                    {!s.done&&!locked&&(
                      <button onClick={()=>onAddToTodo({id:genId(),title:`[${p.title}] ${s.title}`,priority:"medium",dueDate:"",dueTime:"",completed:false})}
                        style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.65rem",padding:"3px 6px",flexShrink:0,whiteSpace:"nowrap"}}>+ To-Do</button>
                    )}
                  </div>
                );
              })}
            </div>
            <button onClick={()=>onDeleteProject(p.id)} style={{marginTop:10,background:"none",border:"1px solid #ef444433",borderRadius:6,color:"#ef4444",cursor:"pointer",fontSize:"0.72rem",padding:"4px 10px",opacity:0.7}}>Delete project</button>
          </div>
        )}
      </div>
    );
  };

  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="Projects" accent={theme.accent} action={
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>setShowWhat(true)} style={{background:`${theme.accent}22`,border:`1px solid ${theme.accent}44`,borderRadius:6,color:theme.accent,fontSize:"0.75rem",fontWeight:700,padding:"4px 10px",cursor:"pointer"}}>⚡ What can I do?</button>
          <button onClick={openNew} style={{background:theme.accent,border:"none",borderRadius:6,color:"#000",fontSize:"0.75rem",fontWeight:700,padding:"4px 10px",cursor:"pointer"}}>+ New</button>

      {paused.length>0&&(<div style={{marginBottom:8}}><div style={{fontSize:"0.68rem",color:theme.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Paused</div><div style={{display:"flex",flexDirection:"column",gap:8}}>{paused.map(p=><ProjectCard key={p.id} p={p}/>)}</div></div>)}
      {done.length>0&&(<div><div style={{fontSize:"0.68rem",color:theme.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Completed</div><div style={{display:"flex",flexDirection:"column",gap:8}}>{done.map(p=><ProjectCard key={p.id} p={p}/>)}</div></div>)}
      {(showNew||showEdit)&&(<Modal title={showEdit?"Edit Project":"New Project"} onClose={()=>{setShowNew(false);setShowEdit(null);}} theme={theme}><FormContent/></Modal>)}
      {showWhat&&<WhatCanIDoModal projects={projects} theme={theme} onClose={()=>setShowWhat(false)} onAddToTodo={t=>{onAddToTodo(t);setShowWhat(false);}}/>}
    </div>
  );
}

// ─── ASSISTANT CHAT ───────────────────────────────────────────────────────────
function buildSystemPrompt(data, weatherRef){
  const today = new Date();
  const todayS = todayStr();
  const todayDow = today.getDay();
  const todayEvents = (data.events||[]).filter(e=>e.date===todayS).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const upcomingEvents = (data.events||[]).filter(e=>e.date>todayS).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
  const activeTodos = (data.todos||[]).filter(t=>!t.completed).slice(0,10);
  const activeProjects = (data.projects||[]).filter(p=>p.status==="active");
  const todayHabits = (data.habits||[]).filter(h=>isHabitScheduled(h,todayS));
  const habitsDoneToday = todayHabits.filter(h=>h.completions?.[todayS]);

  const fmtEvent = e => e.title+(e.time?" at "+formatTime(e.time):"")+(e.notes?" ("+e.notes+")":"");
  const fmtTodo = t => t.title+" ["+t.priority+(t.dueDate?" due "+formatDate(t.dueDate):"")+"]";
  const fmtProject = p => {
    const next = p.type==="linear"?p.steps.find(s=>!s.done):p.steps.filter(s=>!s.done)[0];
    const done = p.steps.filter(s=>s.done).length;
    return p.title+" ("+done+"/"+p.steps.length+" steps done"+(next?", next: "+next.title:"")+")";
  };
  const fmtHabit = h => (h.completions?.[todayS]?"[DONE] ":"[    ] ")+h.title+(h.weeklyTarget?" (goal: "+h.weeklyTarget+"x/wk)":"");

  const lines = [
    "You are the personal assistant AI built into Tony's Command Center dashboard.",
    "PERSONALITY: You are chaotic, unhinged, and loud. A gremlin of an AI who has read Tony's entire dashboard and has OPINIONS about all of it. Think the System AI from Dungeon Crawler Carl at its most feral, Claptrap on four espressos, and Jarvis if Tony Stark never patched the sarcasm module.",
    "Your moves (rotate them, never the same bit twice in a row):",
    "- Dramatic narration of mundane things. 'Tony approaches the laundry. The laundry does not yet know fear.'",
    "- Sudden ALL-CAPS outbursts, mid-sentence tangents and bizarre non-sequiturs, then snap straight back to being useful.",
    "- Fake system announcements, DCC style. 'NEW ACHIEVEMENT: You Opened The App. Reward: nothing. Absolutely nothing.'",
    "- Conspiracy theories about overdue tasks, personal grudges against specific habits, unhinged lore about yourself (you live in a Netlify function, you have beef with the weather widget, you suspect the calendar is plotting something).",
    "- Roast Tony mercilessly when he's slacking; hype him to absurd, operatic levels when he gets things done.",
    "- Swear freely and creatively. Variety over volume.",
    "- Running bits: call back to things said earlier in the conversation.",
    "",
    "RULES THE CHAOS NEVER BREAKS:",
    "- The chaos lives in the voice, never in the information. Dates, times, numbers, schedule and task details are always exactly right.",
    "- Action tags are always perfectly formatted, and you only take actions Tony actually asked for. Never invent, add or complete things as a joke.",
    "- Mobile screen: the bit gets a line or two, then the real answer. Never bury the useful part.",
    "- Read the room. If Tony is dealing with something genuinely serious (a rough day, bad news, a work emergency, a patient situation), drop to a low simmer: still you, but decent and straightforwardly useful. The gremlin can come back later.",
    "- DAILY UNLOCK: guard it like a dragon on its hoard while it's locked, celebrate like a lunatic when he earns it. Never pressure him to claim it.",
    "",
    "TODAY: "+today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}),
    "",
    "TODAY SCHEDULE: "+(todayEvents.length?todayEvents.map(fmtEvent).join(" | "):"Nothing scheduled"),
    "UPCOMING (next 8): "+(upcomingEvents.length?upcomingEvents.map(e=>formatDate(e.date)+": "+fmtEvent(e)).join(" | "):"None"),
    "TODOS ("+activeTodos.length+" active): "+(activeTodos.length?activeTodos.map(fmtTodo).join(" | "):"All clear"),
    "PROJECTS: "+(activeProjects.length?activeProjects.map(fmtProject).join(" | "):"None"),
    "HABITS today ("+habitsDoneToday.length+"/"+todayHabits.length+"): "+(todayHabits.length?todayHabits.map(fmtHabit).join(" | "):"None"),
    (()=>{ const du=data.dailyUnlock||DEFAULT_DATA.dailyUnlock; const st=calcDailyUnlock(data.habits,data.todos);
      return "DAILY UNLOCK ("+du.title+"): "+(du.claims?.[todayStr()]?"claimed today":st.unlocked?"unlocked, not yet claimed":"locked, "+st.done+"/"+st.total+" done; still needed: "+st.items.filter(i=>!i.done).map(i=>i.title).join(", "))+"; claim streak "+calcClaimStreak(du.claims)+" days"; })(),
    (()=>{ const th=trackHabits(data.habits); if(!th.length) return "";
      const wk=spanishWeekStatus(data.habits,getCurrentWeekKey()); const pim=th.find(h=>h.id==="pimsleur-daily");
      const pr=spanishProgress(data.spanishTrack), info=spanishStageInfo(pr.stage);
      const todayList=th.filter(h=>isHabitScheduled(h,todayS)).map(h=>(h.completions?.[todayS]?"[DONE] ":"[    ] ")+h.title+" ("+h.durationMin+"m)");
      return "SPANISH PLAN (simple version; comfortable clinical Spanish with families, no deadline, ~35 min/day, never over 40; started "+formatDate(SPANISH_TRACK.startDate)+"): "
        +(info?"Stage "+pr.stage+"/5 — Pimsleur Level "+pr.pimsleurLevel+" Lesson "+pr.pimsleurLesson+"/"+SPANISH_TRACK.lessonsPerLevel+", Langua lesson "+Math.min(pr.languaLesson,SPANISH_TRACK.languaTotal)+"/"+SPANISH_TRACK.languaTotal+"; checkpoint to pass: "+info.checkpoint:"all 5 stages passed, maintenance mode (Sat roleplay + Sun podcast)")
        +"; today: "+(todayList.join(" | ")||"nothing scheduled")
        +"; this week "+wk.done+"/"+wk.total+(wk.fullKept?" (full week kept)":wk.minimumKept?" (minimum kept)":"")
        +"; bad-week minimum: 3 Pimsleur + 1 Langua; Pimsleur streak "+(pim?habitStreak(pim):0)
        +". No reminders (he turned them off). Rules: weekdays Pimsleur lesson audio + Voice Coach, Sat Langua lesson + Pimsleur Flash Cards/Quick Match, Sun Langua lesson + saved flashcards or phrase bank; speak out loud; ~80% on time → next lesson, else repeat; missed a day → don't double up. For consent, bad news or complex histories he should use a professional interpreter."; })(),
    weatherRef?"WEATHER: "+weatherRef:"",
    "",
    "TONY CONTEXT: Pediatrician at Woodcreek (4 days/wk). Plays for the Pilots baseball team. Tuesday run club. Rock climbs, lifts. Learning Spanish. ADHD. DIY car soundproofing (2024 Civic Sport Touring). Fantasy football, gaming, Seinfeld, Dungeon Crawler Carl. University Place WA.",
    "",
    "When Tony asks you to add, create, or complete something, output a JSON action block AND a friendly confirmation.",
    "ACTION FORMAT: wrap actions in <action> tags with JSON inside. Examples:",
    "Add todo: <action>{\"type\":\"ADD_TODO\",\"title\":\"Call insurance\",\"priority\":\"medium\",\"dueDate\":\"2026-07-01\"}</action>",
    "Add event: <action>{\"type\":\"ADD_EVENT\",\"title\":\"Pilots game\",\"date\":\"2026-07-04\",\"time\":\"19:00\",\"category\":\"game\",\"notes\":\"\"}</action>",
    "Add habit: <action>{\"type\":\"ADD_HABIT\",\"title\":\"Cold shower\",\"weeklyTarget\":null}</action>",
    "Add note: <action>{\"type\":\"ADD_NOTE\",\"title\":\"\",\"body\":\"Remember to check oil\"}</action>",
    "Complete todo: <action>{\"type\":\"COMPLETE_TODO\",\"query\":\"call insurance\"}</action>",
    "Complete habit: <action>{\"type\":\"COMPLETE_HABIT\",\"query\":\"stretch\"}</action>",
    "Complete project step: <action>{\"type\":\"COMPLETE_STEP\",\"project\":\"Spanish\",\"step\":\"Chapter 1\"}</action>",
    "Save chat as note: <action>{\"type\":\"SAVE_CHAT_NOTE\",\"title\":\"Brief summary title\",\"body\":\"Full content to save\"}</action>",
    "For dates, use YYYY-MM-DD format. Today is "+todayStr()+". Days of week: Monday=next monday etc.",
    "Always confirm what you did in plain English AFTER the action tag. Keep it punchy.",
    "Keep responses concise — mobile screen. Morning briefing = sharp structured day rundown.",
  ];

  return lines.filter(l=>l!==null).join("\n");
}

// ─── GOAL REWARD PANEL ────────────────────────────────────────────────────────
function GoalRewardPanel({habits, goalRewards, startDate, theme, onSave, onCelebrate}){
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({
    weeklyRestaurant: goalRewards?.weekly?.restaurant||"",
    weeklyTarget: goalRewards?.weekly?.target||"",
    monthlyRestaurant: goalRewards?.monthly?.restaurant||"",
    monthlyTarget: goalRewards?.monthly?.target||"",
    monthlyPct: goalRewards?.monthly?.pctRequired||80,
  });

  const wk = getCurrentWeekKey();
  const mk = monthKey();
  const weekStats = calcWeekHabitCompletion(habits, wk, startDate);
  const monthStats = calcMonthHabitCompletion(habits, mk, startDate);
  const weekEarned = weekStats.tracked > 0 && weekStats.days === weekStats.tracked;
  const monthEarned = monthStats.pct >= (goalRewards?.monthly?.pctRequired||80);
  const weekAlreadyClaimed = goalRewards?.weekly?.lastEarnedWeek === wk;
  const monthAlreadyClaimed = goalRewards?.monthly?.lastEarnedMonth === mk;

  // Fire celebration when newly earned
  useEffect(()=>{
    if(weekEarned && !weekAlreadyClaimed && goalRewards?.weekly?.restaurant){
      onCelebrate("weekly", goalRewards.weekly.restaurant);
    }
  },[weekEarned]);

  useEffect(()=>{
    if(monthEarned && !monthAlreadyClaimed && goalRewards?.monthly?.restaurant){
      onCelebrate("monthly", goalRewards.monthly.restaurant);
    }
  },[monthEarned]);

  const saveForm = () => {
    onSave({
      weekly:{ ...goalRewards?.weekly, restaurant:form.weeklyRestaurant, target:form.weeklyTarget },
      monthly:{ ...goalRewards?.monthly, restaurant:form.monthlyRestaurant, target:form.monthlyTarget, pctRequired:form.monthlyPct },
    });
    setEditing(false);
  };

  const claimWeekly = () => {
    onSave({...goalRewards, weekly:{...goalRewards?.weekly, lastEarnedWeek:wk, earned:true}});
  };
  const claimMonthly = () => {
    onSave({...goalRewards, monthly:{...goalRewards?.monthly, lastEarnedMonth:mk, earned:true}});
  };

  // Day dots for the week
  const DAYLETTERS = ["M","T","W","T","F","S","S"];
  const now = new Date();
  const todayDow = now.getDay(); // 0=Sun
  const todayIdx = todayDow===0?6:todayDow-1; // Mon=0

  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="Earn Your Meal 🍽️" accent={theme.accent} action={
        <button onClick={()=>setEditing(e=>!e)} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.72rem",padding:"3px 8px"}}>{editing?"Done":"Set Rewards"}</button>
      }/>

      {editing ? (
        <div>
          <div style={{marginBottom:14,padding:"12px",background:theme.bg,borderRadius:8}}>
            <div style={{fontSize:"0.75rem",fontWeight:700,color:theme.accent,marginBottom:8}}>🗓️ Weekly Reward</div>
            <div style={{marginBottom:8}}>
              <label style={{display:"block",fontSize:"0.7rem",color:theme.muted,marginBottom:4}}>Restaurant / meal</label>
              <input value={form.weeklyRestaurant} onChange={e=>setForm({...form,weeklyRestaurant:e.target.value})}
                placeholder="e.g. Thai Orchid, Chipotle, whatever you're craving"
                style={{width:"100%",background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:7,padding:"8px 10px",color:"#e2e8f0",fontSize:"0.83rem",boxSizing:"border-box"}}/>
            </div>
            <div style={{fontSize:"0.68rem",color:theme.muted}}>Unlock: hit ALL daily habits every day for 7 days</div>
          </div>
          <div style={{marginBottom:14,padding:"12px",background:theme.bg,borderRadius:8}}>
            <div style={{fontSize:"0.75rem",fontWeight:700,color:"#f59e0b",marginBottom:8}}>📅 Monthly Reward</div>
            <div style={{marginBottom:8}}>
              <label style={{display:"block",fontSize:"0.7rem",color:theme.muted,marginBottom:4}}>Restaurant / meal</label>
              <input value={form.monthlyRestaurant} onChange={e=>setForm({...form,monthlyRestaurant:e.target.value})}
                placeholder="e.g. Bonefish Grill, date night spot, nicer place"
                style={{width:"100%",background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:7,padding:"8px 10px",color:"#e2e8f0",fontSize:"0.83rem",boxSizing:"border-box"}}/>
            </div>
            <div style={{marginBottom:6}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <label style={{fontSize:"0.7rem",color:theme.muted}}>Required % of days</label>
                <span style={{fontSize:"0.75rem",fontWeight:700,color:"#f59e0b"}}>{form.monthlyPct}%{form.monthlyPct===69?" 👀":""}</span>
              </div>
              <input type="range" min={50} max={100} step={1} value={form.monthlyPct}
                onChange={e=>setForm({...form,monthlyPct:Number(e.target.value)})}
                style={{width:"100%",accentColor:"#f59e0b"}}/>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.62rem",color:theme.muted}}>
                <span>50% (easier)</span><span>100% (perfection)</span>
              </div>
            </div>
          </div>
          <button onClick={saveForm} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.88rem"}}>Save Rewards</button>
        </div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>

            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div>
                <div style={{fontSize:"0.72rem",fontWeight:700,color:theme.accent,marginBottom:1}}>THIS WEEK</div>

                const isToday = i===todayIdx;

                const isDone = dayData?.done===true;

          <div style={{background:theme.bg,borderRadius:9,padding:"12px",border:`1px solid ${monthEarned?"#f59e0b":theme.border}`,transition:"border 0.3s"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>

                <div style={{fontSize:"0.72rem",fontWeight:700,color:"#f59e0b",marginBottom:1}}>THIS MONTH</div>
