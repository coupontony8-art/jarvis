<script>
// ─── PWA STORAGE (localStorage wrapper matching window.storage API) ───────────
const pwaStorage = {
  get: async (key) => {
    try {
      const val = localStorage.getItem(key);
      return val ? { key, value: val } : null;
    } catch { return null; }
  },
  set: async (key, value) => {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch { return null; }
  },
  delete: async (key) => {
    try { localStorage.removeItem(key); return { key, deleted: true }; }
    catch { return null; }
  },
  list: async (prefix) => {
    try {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      return { keys };
    } catch { return { keys: [] }; }
  }
};

// ─── SERVICE WORKER REGISTRATION ─────────────────────────────────────────────
// ─── NTFY NOTIFICATION HELPER ────────────────────────────────────────────────
// Returns {ok, status, topic, error} so callers (like the Settings test) can report what happened
async function sendNotification(title, message, priority="default", tags=["bell"]) {
  try {
    const res = await fetch("/.netlify/functions/notify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, message, priority, tags }),
    });
    let data = {};
    try { data = await res.json(); } catch { data = { error: "Unexpected response from notify function" }; }
    return { ok: res.ok && !!data.ok, status: res.status, topic: data.topic, error: data.error };
  } catch(e) {
    console.log("Notification failed:", e.message);
    return { ok: false, status: 0, error: e.message };
  }
}

// ─── SERVER SYNC (for contextual push notifications) ─────────────────────────
// Compact habit list for server-side reminders (only what check-reminders needs)
function habitsForServer(habits){
  const cutoff=localDateStr(new Date(Date.now()-3*86400000));
  return (habits||[]).filter(h=>h.reminderTime).map(h=>({
    id:h.id, title:h.title, detail:h.detail||"", durationMin:h.durationMin||null, reminderTime:h.reminderTime,
    frequency:h.frequency, daysOfWeek:h.daysOfWeek||[], startDate:h.startDate||null,
    doneDates:Object.keys(h.completions||{}).filter(d=>h.completions[d]&&d>=cutoff),
  }));
}
async function syncEventsToServer(events, todos, habits) {
  try {
    const today = localDateStr(new Date());
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() + 14);
    const cutoffStr = localDateStr(cutoff);
    // Include all future events in next 14 days
    const upcoming = (events||[]).filter(e => e.date && e.date >= today && e.date <= cutoffStr);
    // Include all active todos
    const activeTodos = (todos||[]).filter(t => !t.completed);
    const payload = { events: upcoming, todos: activeTodos, habits: habitsForServer(habits) };
    console.log("Syncing to server:", upcoming.length, "events,", activeTodos.length, "todos");
    const res = await fetch("/.netlify/functions/sync-events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    let result = {};
    try { result = await res.json(); } catch { result = { error: "Unexpected response from sync function" }; }
    console.log("Sync result:", res.status, result);
    return { ...result, ok: res.ok && !!result.ok, status: res.status };
  } catch(e) {
    console.log("Sync failed:", e.message);
    return { ok: false, status: 0, error: e.message };
  }
}

// ─── SERVICE WORKER (offline caching only) ───────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('SW registered'))
    .catch(e => console.log('SW failed:', e.message));
}

window.requestNotificationPermission = async () => true;
window.sendLocalNotification = (title, body, delay=0) => {
  setTimeout(() => sendNotification(title, body), delay);
};

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function quip(key, vars={}){
  const src = QUIPS[key];
  if(!src) return "";
  let s = Array.isArray(src) ? pick(src) : src;
  Object.entries(vars).forEach(([k,v])=>{ s=s.replaceAll(`{${k}}`,v); });
  return s;
}
// Same message all day for a given seed (no re-roll on every render)
function stablePick(arr, seed){
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))|0;
  return arr[Math.abs(h)%arr.length];
}
function fillQuip(s, vars){ Object.entries(vars).forEach(([k,v])=>{ s=s.replaceAll(`{${k}}`,v); }); return s; }

// Whole calendar days between a "YYYY-MM-DD" (local) and today
function daysSinceLocal(dateStr){
  if(!dateStr) return null;
  const [y,m,d]=dateStr.slice(0,10).split("-").map(Number);
  const then=new Date(y,m-1,d), now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((today-then)/86400000);
}

// Habits that count as progress on a project (e.g. Spanish track habits → Spanish project)
function linkedHabits(p, habits){
  if(!habits) return [];
  const track = p.track || (/spanish/i.test(p.title||"") ? "spanish-clinical" : null);
  const ids = new Set(p.habitIds||[]);
  return habits.filter(h=>ids.has(h.id) || (track && h.track===track));
}
function lastHabitActivity(p, habits){
  const today=todayStr(); let last=null;
  linkedHabits(p, habits).forEach(h=>Object.keys(h.completions||{}).forEach(d=>{
    if(h.completions[d] && d<=today && (!last || d>last)) last=d;
  }));
  return last;
}

// How long a project has sat idle, and whether it's ever been started
function projectIdle(p, habits){
  const habitDate=lastHabitActivity(p, habits);
  const started=!!p.lastProgressDate || !!habitDate || (p.steps||[]).some(s=>s.done);
  const progress=[p.lastProgressDate, habitDate].filter(Boolean).sort().pop() || null;
  const ref=progress || p.createdAt || null;
  const days=daysSinceLocal(ref);
  return { started, days, overdue: !!p.nudgeDays && (days===null || days>=p.nudgeDays) };
}

function nudgeMessage(p, habits){
  const {started, days}=projectIdle(p, habits);
  const seed=p.id+todayStr();
  if(!started) return fillQuip(stablePick(QUIPS.nudgeNotStarted, seed), {project:p.title});
  const pool = days===null ? QUIPS.nudge.filter(q=>!q.includes("{days}")) : QUIPS.nudge;
  return fillQuip(stablePick(pool, seed), {project:p.title, days});
}

function getGreeting(name){
  const h=new Date().getHours();
  if(h<12) return quip("greetMorning",{name});
  if(h<17) return quip("greetAfternoon",{name});
  return quip("greetEvening",{name});
}

// ─── HABIT DATA HELPERS ──────────────────────────────────────────────────────
function monthKey(date){ const d=date||new Date(); return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function prevMonthKey(mk){ const[y,m]=mk.split("-").map(Number); return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,"0")}`; }
function sameMonthLastYearKey(mk){ const[y,m]=mk.split("-"); return`${parseInt(y)-1}-${m}`; }
function daysInMonthFromKey(mk){ const[y,m]=mk.split("-").map(Number); return new Date(y,m,0).getDate(); }
function daysElapsedInMonth(mk){ const[y,m]=mk.split("-").map(Number); const now=new Date(); if(now.getFullYear()===y&&now.getMonth()===m-1) return now.getDate(); return daysInMonthFromKey(mk); }

function calcHabitMonthRate(habit, mk, startDate){
  const[y,m]=mk.split("-").map(Number);
  const days=daysInMonthFromKey(mk);
  const cutoff=startDate||"2000-01-01";

  if(habit.weeklyTarget){
    // Weekly-target mode: count weeks in month, goal = weeklyTarget per week
    // Count actual completions vs (weeks * weeklyTarget)
    let completions=0, weeks=0;
    let weekStart=null;
    for(let d=1;d<=days;d++){
      const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const dow=new Date(ds+"T12:00:00").getDay();
      if(dow===0) weeks++; // new week (Sunday)
      if(habit.completions?.[ds]) completions++;
    }
    // if month doesn't start on Sunday, still count the first partial week
    const firstDow=new Date(`${y}-${String(m).padStart(2,"0")}-01T12:00:00`).getDay();
    if(firstDow!==0) weeks++;
    const target=weeks*habit.weeklyTarget;
    return target===0?null:Math.round((completions/target)*100);
  }

  // Default: % of scheduled days completed (only from startDate onward)
  const today=todayStr();
  let scheduled=0,completed=0;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if(ds>today) continue;   // future
    if(ds<cutoff) continue;  // before tracking start
    const isScheduled=isHabitScheduled(habit,ds);
    if(isScheduled){ scheduled++; if(habit.completions?.[ds]) completed++; }
  }
  return scheduled===0?null:Math.round((completed/scheduled)*100);
}

function calcGoalForHabit(habit, mk){
  // last month rate
  const prevMk=prevMonthKey(mk);
  const prevRate=calcHabitMonthRate(habit,prevMk);
  // same month last year
  const lastYearMk=sameMonthLastYearKey(mk);
  const lastYearRate=calcHabitMonthRate(habit,lastYearMk);
  if(prevRate===null) return 69; // giggity
  const bump=prevRate>=85?5:prevRate>=70?7:10;
  return Math.min(95,prevRate+bump);
}

function getHabitGoal(habit, mk){
  // stored goal takes precedence; otherwise calculate
  return habit.monthlyGoals?.[mk] ?? calcGoalForHabit(habit,mk);
}

// ─── GOAL REWARD HELPERS ─────────────────────────────────────────────────────
function getWeekKey(date){
  const d = date ? new Date(date) : new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  const mon = new Date(d.setDate(diff));
  return localDateStr(mon);
}
function getCurrentWeekKey(){ return getWeekKey(new Date()); }

function calcWeekHabitCompletion(habits, weekStartStr, startDate){
  const start = new Date(weekStartStr+"T12:00:00");
  const today = todayStr();
  const cutoff = startDate || "2000-01-01";
  const dailyHabits = habits.filter(h=>h.frequency==="daily");
  if(!dailyHabits.length) return {days:0, total:0, pct:0, allDays:[], tracked:0};
  let days=0, tracked=0;
  const allDays = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    const ds = localDateStr(d);
    // Future days — skip, show as pending
    if(ds > today){ allDays.push({date:ds,done:null}); continue; }
    // Before tracking start date — skip entirely, don't count as missed
    if(ds < cutoff){ allDays.push({date:ds,done:"skip"}); continue; }
    tracked++;
    const allDone = dailyHabits.every(h=>h.completions?.[ds]);
    if(allDone) days++;
    allDays.push({date:ds, done:allDone});
  }
  return {days, total:tracked, pct:tracked?Math.round((days/tracked)*100):0, allDays, tracked};
}

function calcMonthHabitCompletion(habits, mk, startDate){
  const [y,m] = mk.split("-").map(Number);
  const daysTotal = daysInMonthFromKey(mk);
  const today = todayStr();
  const cutoff = startDate || "2000-01-01";
  const dailyHabits = habits.filter(h=>h.frequency==="daily");
  if(!dailyHabits.length) return {days:0, total:0, pct:0};
  let days=0, tracked=0;
  for(let d=1;d<=daysTotal;d++){
    const ds=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if(ds>today) continue;        // future — skip
    if(ds<cutoff) continue;       // before start date — skip, not a miss
    tracked++;
    if(dailyHabits.every(h=>h.completions?.[ds])) days++;
  }
  return {days, total:tracked, pct:tracked?Math.round((days/tracked)*100):0};
}

// ─── DAILY UNLOCK HELPERS ────────────────────────────────────────────────────
// What has to be done today: habits scheduled today + todos due today.
// Weekly-target habits (e.g. workout 3x/wk) only become required on a day when
// skipping it would make the weekly target impossible.
function calcDailyUnlock(habits, todos, dateStr){
  const ds = dateStr || todayStr();
  const date = new Date(ds+"T12:00:00");
  const dow = date.getDay();
  const weekStart = new Date(getWeekKey(date)+"T12:00:00");
  const items = [];
  (habits||[]).forEach(h=>{
    if(!isHabitScheduled(h, ds)) return;
    const doneToday = !!h.completions?.[ds];
    if(h.weeklyTarget){
      let doneBefore = 0;
      for(let d=new Date(weekStart); localDateStr(d)<ds; d.setDate(d.getDate()+1)){
        if(h.completions?.[localDateStr(d)]) doneBefore++;
      }
      const daysLeftInclToday = 7 - ((dow+6)%7); // Mon=7 … Sun=1
      const stillNeeded = h.weeklyTarget - doneBefore;
      if(stillNeeded <= 0) return;                         // target already hit this week
      if(!doneToday && stillNeeded < daysLeftInclToday) return; // can still skip today
      items.push({kind:"habit", id:h.id, title:h.title, done:doneToday, note:`${doneBefore}/${h.weeklyTarget} this week`});
      return;
    }
    items.push({kind:"habit", id:h.id, title:h.title, done:doneToday});
  });
  (todos||[]).forEach(t=>{
    if(t.dueDate===ds) items.push({kind:"todo", id:t.id, title:t.title, done:!!t.completed});
  });
  const done = items.filter(i=>i.done).length;
  return { items, done, total:items.length, unlocked: items.every(i=>i.done) };
}

function calcClaimStreak(claims){
  let streak=0;
  const d=new Date();
  if(!claims?.[localDateStr(d)]) d.setDate(d.getDate()-1); // today not claimed yet doesn't break it
  while(claims?.[localDateStr(d)]){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}

function localDateStr(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function genId()    { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function todayStr() { return localDateStr(new Date()); }
function formatDate(d){ if(!d)return""; const[y,m,day]=d.split("-"); return`${m}/${day}/${y}`; }
function formatTime(t){ if(!t)return""; const[h,m]=t.split(":"); const hh=parseInt(h); return`${hh%12||12}:${m} ${hh>=12?"PM":"AM"}`; }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDayOfMonth(y,m){ return new Date(y,m,1).getDay(); }
function fmtMins(m){ if(m<60)return`${m}m`; return m%60===0?`${m/60}h`:`${Math.floor(m/60)}h ${m%60}m`; }
function timeAgo(ts){ const d=Date.now()-ts; if(d<60000)return"just now"; if(d<3600000)return`${Math.floor(d/60000)}m ago`; if(d<86400000)return`${Math.floor(d/3600000)}h ago`; return`${Math.floor(d/86400000)}d ago`; }

function spanishProgress(st){ return {...SPANISH_DEFAULT_PROGRESS, ...(st?.progress||{})}; }
function spanishStageInfo(stage){ return SPANISH_TRACK.stages.find(s=>s.stage===stage)||null; } // null = maintenance (past stage 5)

// Weekend habit titles follow the stage; after Stage 5, weekday Pimsleur is retired (history kept)
function applySpanishStage(habits, stage){
  const info=spanishStageInfo(stage), base=Object.fromEntries(SPANISH_TRACK.habits.map(h=>[h.id,h]));
  const sat=info?(info.sat||base["sat-langua"]):SPANISH_TRACK.maintain.sat;
  const sun=info?(info.sun||base["sun-langua"]):SPANISH_TRACK.maintain.sun;
  return (habits||[]).map(h=>{
    if(h.id==="sat-langua") return {...h, title:sat.title, detail:sat.detail};
    if(h.id==="sun-langua") return {...h, title:sun.title, detail:sun.detail};
    if(h.id==="pimsleur-daily") return {...h, daysOfWeek: info?base["pimsleur-daily"].daysOfWeek:[]};
    return h;
  });
}

function spanishProjectSteps(stage, checkpoints){

// Install / upgrade the Spanish track. Keeps Pimsleur check-off history; removes
// habits from the old plan; turns the Spanish project's steps into the 5 stages.
function installSpanishTrack(data){
  const st=data.spanishTrack||{};
  if(st.installed && (st.version||1)>=SPANISH_TRACK.version) return data;
  const keep=new Set(SPANISH_TRACK.habits.map(h=>h.id));
  let habits=(data.habits||[]).filter(h=>h.track!==SPANISH_TRACK.id || keep.has(h.id));
  SPANISH_TRACK.habits.forEach(ph=>{
    const {kind, ...rest}=ph;
    const fields={...rest, kind, frequency:"weekly", weeklyTarget:null, startDate:SPANISH_TRACK.startDate, track:SPANISH_TRACK.id};
    let idx=habits.findIndex(h=>h.id===ph.id);
    if(idx<0 && ph.id==="pimsleur-daily") idx=habits.findIndex(h=>/pimsleur/i.test(h.title||""));
    if(idx>=0){ const {xp, streakTracked, ...old}=habits[idx]; habits[idx]={...old, ...fields, completions:old.completions||{}, monthlyGoals:old.monthlyGoals||{}}; }
    else habits.push({...fields, completions:{}, monthlyGoals:{}});
  });
  const progress=spanishProgress(st), checkpoints=st.checkpoints||{};
  habits=applySpanishStage(habits, progress.stage);
  const projects=(data.projects||[]).map(p=>!/spanish/i.test(p.title||"")?p:{
    ...p, type:"linear", track:SPANISH_TRACK.id,
    description:"Comfortable clinical Spanish with families. No deadline. Pimsleur Levels 1–5 on weekdays + Langua on weekends, ~35 min a day. Move to the next stage when you pass its checkpoint.",
    steps:spanishProjectSteps(progress.stage, checkpoints),
  });
  const {badges, ...restSt}=st;
  return {...data, habits, projects, spanishTrack:{...restSt, installed:true, version:SPANISH_TRACK.version, progress, checkpoints, installedAt:st.installedAt||todayStr()}};
}

// Pass the current stage's checkpoint → next stage (pure; used by the card and the project step)
function spanishAdvanceStage(data){
  const st=data.spanishTrack||{}, pr=spanishProgress(st);
  if(pr.stage>SPANISH_TRACK.stages.length) return data;
  const today=todayStr(), checkpoints={...(st.checkpoints||{}), [pr.stage]:today};
  const stage=pr.stage+1;
  const progress={...pr, stage, pimsleurLevel:Math.min(stage,5), pimsleurLesson:stage<=5?1:pr.pimsleurLesson};
  const habits=applySpanishStage(data.habits, stage);
  const projects=(data.projects||[]).map(p=>p.track!==SPANISH_TRACK.id?p:{...p, lastProgressDate:today, steps:spanishProjectSteps(stage, checkpoints)});
  return {...data, habits, projects, spanishTrack:{...st, progress, checkpoints}};
}

function normTitle(t){ return String(t||"").trim().toLowerCase(); }
// Combine habits with the same name: first one wins its settings; check-offs
// and monthly goals from all copies are kept.
function mergeDuplicateHabits(habits){
  const byTitle=new Map(), out=[];
  (habits||[]).forEach(h=>{
    const k=normTitle(h.title), prev=byTitle.get(k);
    if(!prev){ const copy={...h}; byTitle.set(k,copy); out.push(copy); return; }
    prev.completions={...(h.completions||{}), ...(prev.completions||{})};
    Object.keys(h.completions||{}).forEach(d=>{ if(h.completions[d]) prev.completions[d]=true; });
    prev.monthlyGoals={...(h.monthlyGoals||{}), ...(prev.monthlyGoals||{})};
  });
  return out;
}

// Is this habit on the schedule for a given day? (respects per-habit start date)
function isHabitScheduled(h, ds){
  if(h.startDate && ds < h.startDate) return false;
  if(h.frequency==="daily") return true;
  const dow=new Date(ds+"T12:00:00").getDay();
  return (h.daysOfWeek||[]).includes(dow);
}

function addDaysStr(ds, n){ const d=new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return localDateStr(d); }
function weekDates(weekKey){ return [0,1,2,3,4,5,6].map(i=>addDaysStr(weekKey,i)); } // Mon..Sun
function trackHabits(habits){ return (habits||[]).filter(h=>h.track===SPANISH_TRACK.id); }

// Consecutive scheduled days completed, walking back from today.
// Today not done yet doesn't break the streak.
function habitStreak(h){
  let streak=0, ds=todayStr(), guard=0;
  if(isHabitScheduled(h,ds) && !h.completions?.[ds]) ds=addDaysStr(ds,-1);
  while(guard++<800){
    if(h.startDate && ds<h.startDate) break;
    if(isHabitScheduled(h,ds)){ if(h.completions?.[ds]) streak++; else break; }
    ds=addDaysStr(ds,-1);
  }
  return streak;
}
function habitBestStreak(h){
  let best=0, run=0, ds=h.startDate||todayStr();
  const end=todayStr();
  for(let g=0; ds<=end && g<800; g++, ds=addDaysStr(ds,1)){
    if(!isHabitScheduled(h,ds)) continue;
    if(h.completions?.[ds]){ run++; best=Math.max(best,run); } else if(ds<end) run=0;
  }
  return best;
}

// Status of one Mon–Sun week of the track.
// Minimum = 3 Pimsleur + 1 Langua (capped at what's actually scheduled that week).
function spanishWeekStatus(habits, weekKey){
  const th=trackHabits(habits), today=todayStr();
  const days=weekDates(weekKey).map(ds=>({
    ds,
    items:th.filter(h=>isHabitScheduled(h,ds)).map(h=>({id:h.id,title:h.title,kind:h.kind||(h.id==="pimsleur-daily"?"pimsleur":"langua"),done:!!h.completions?.[ds]})),
  }));
  const all=days.flatMap(d=>d.items.map(i=>({...i,ds:d.ds})));
  const total=all.length, done=all.filter(i=>i.done).length;
  const count=(kind,f)=>all.filter(i=>i.kind===kind&&f(i)).length;
  const need={ pimsleur:Math.min(SPANISH_TRACK.minimumWeek.pimsleur, count("pimsleur",()=>true)),
               langua:Math.min(SPANISH_TRACK.minimumWeek.langua, count("langua",()=>true)) };
  const got={ pimsleur:count("pimsleur",i=>i.done), langua:count("langua",i=>i.done) };
  const open={ pimsleur:count("pimsleur",i=>!i.done&&i.ds>=today), langua:count("langua",i=>!i.done&&i.ds>=today) };
  const fullKept = total>0 && done===total;
  const minimumKept = total>0 && got.pimsleur>=need.pimsleur && got.langua>=need.langua;
  const over = addDaysStr(weekKey,6) < today;
  const minimumAlive = got.pimsleur+open.pimsleur>=need.pimsleur && got.langua+open.langua>=need.langua;
  return {days,total,done,fullKept,minimumKept,minimumAlive,over,need,got};
}

function spanishWeeksKept(habits){
  const start=SPANISH_TRACK.startDate;
  let wk=getWeekKey(new Date(start+"T12:00:00")), kept=0, full=0, guard=0;
  const thisWeek=getCurrentWeekKey();
  while(wk<thisWeek && guard++<200){
    const st=spanishWeekStatus(habits,wk);
    if(st.fullKept) full++;
    if(st.fullKept||st.minimumKept) kept++;
    wk=addDaysStr(wk,7);
  }
  return {kept,full};
}

// ─── VOICE PARSER ─────────────────────────────────────────────────────────────
function parseVoiceInput(text){
  const lower=text.toLowerCase(),result={type:null,data:{}};
  const timeMatch=text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  const parsedTime=timeMatch?(()=>{ let h=parseInt(timeMatch[1]); const m=timeMatch[2]||"00",ap=timeMatch[3].toLowerCase(); if(ap==="pm"&&h!==12)h+=12; if(ap==="am"&&h===12)h=0; return`${String(h).padStart(2,"0")}:${m}`; })():null;
  const datePatterns=[
    {rx:/\b(today)\b/,fn:()=>todayStr()},
    {rx:/\b(tomorrow)\b/,fn:()=>{const d=new Date();d.setDate(d.getDate()+1);return localDateStr(d);}},
    {rx:/\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i,fn:m=>{const t=DAYS_FULL.findIndex(d=>d.toLowerCase()===m.toLowerCase());const now=new Date();let diff=t-now.getDay();if(diff<=0)diff+=7;const d=new Date();d.setDate(d.getDate()+diff);return localDateStr(d);}},
    {rx:/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/,fn:(m,full)=>{const mm=full.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);if(!mm)return null;const y=mm[3]?(mm[3].length===2?"20"+mm[3]:mm[3]):new Date().getFullYear().toString();return`${y}-${mm[1].padStart(2,"0")}-${mm[2].padStart(2,"0")}`;}}
  ];
  let parsedDate=null;
  for(const p of datePatterns){const m=lower.match(p.rx);if(m){parsedDate=p.fn(m[1],text);break;}}
  if(/\b(add note|note down|jot|remember that)\b/.test(lower)){
    const body=text.replace(/add note|note down|jot|remember that/gi,"").trim();
    result.type="note";result.data={body};
  } else if(/\b(add todo|add task|remind me to|don't forget|remember to)\b/.test(lower)){
    let title=text.replace(/add todo|add task|remind me to|don't forget|remember to/gi,"").trim();
    if(parsedTime)title=title.replace(timeMatch[0],"").trim();
    if(parsedDate)title=title.replace(/(today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/gi,"").trim();
    title=title.replace(/\s+/g," ").trim();
    const priority=lower.includes("urgent")||lower.includes("high priority")?"high":lower.includes("low priority")?"low":"medium";
    result.type="todo";result.data={title,priority,dueDate:parsedDate||"",dueTime:parsedTime||""};
  } else if(/\b(add event|schedule|game|appointment|meeting)\b/.test(lower)){
    let title=text.replace(/add event|schedule/gi,"").trim();
    if(parsedTime)title=title.replace(timeMatch[0],"").trim();
    if(parsedDate)title=title.replace(/(today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/gi,"").trim();
    title=title.replace(/\s+/g," ").trim();
    const cat=lower.includes("game")?"game":lower.includes("appointment")?"appointment":lower.includes("work")?"work":"other";
    result.type="event";result.data={title,date:parsedDate||todayStr(),time:parsedTime||"",category:cat};
  } else if(/\b(add habit|track|daily)\b/.test(lower)){
    result.type="habit";result.data={title:text.replace(/add habit|track|daily/gi,"").trim()};
  }
  return result;
}

// ─── CLOCK ────────────────────────────────────────────────────────────────────
function Clock({accent}){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  return(
    <div style={{textAlign:"center",padding:"10px 0 4px"}}>
      <div style={{fontSize:"2.5rem",fontWeight:700,letterSpacing:"-1px",color:accent,fontFamily:"'SF Mono','Fira Code',monospace"}}>
        {now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
      </div>
      <div style={{fontSize:"0.82rem",color:"#94a3b8",marginTop:2}}>
        {now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}
      </div>
    </div>
  );
}

// ─── VOICE BUTTON ─────────────────────────────────────────────────────────────
function VoiceButton({onTranscript,accent}){
  const [listening,setListening]=useState(false);
  const [supported]=useState(()=>"webkitSpeechRecognition" in window||"SpeechRecognition" in window);
  const recRef=useRef(null);
  const toggle=()=>{
    if(!supported){alert("Voice not supported here — use the chat button instead! Tap ⚡ bottom-right, then tap the mic in the chat.");return;}
    if(listening){recRef.current?.stop();setListening(false);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=1;
    rec.onresult=e=>{onTranscript(e.results[0][0].transcript);setListening(false);};
    rec.onerror=()=>setListening(false);rec.onend=()=>setListening(false);
    rec.start();recRef.current=rec;setListening(true);
  };
  return(
    <button onClick={toggle} title={listening?"Stop":"Voice"} style={{background:listening?accent:"transparent",border:`1.5px solid ${listening?accent:"#334155"}`,borderRadius:"50%",width:36,height:36,cursor:"pointer",color:listening?"#000":"#94a3b8",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s",flexShrink:0}}>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>

// ─── WEATHER LOCATION ─────────────────────────────────────────────────────────
// Weather uses a saved location so the app never has to ask for GPS on open.
// Default is home (University Place, WA); the 📍 button updates it on demand.
const WX_LOC_KEY = "jarvis_weather_location";
const DEFAULT_WX_LOC = { lat:47.2357, lon:-122.5504, label:"University Place" };
function getWeatherLocation(){
  try{ const v=JSON.parse(localStorage.getItem(WX_LOC_KEY)||"null"); if(v&&typeof v.lat==="number") return v; }catch{}
  return DEFAULT_WX_LOC;
}
function saveWeatherLocation(loc){ try{ localStorage.setItem(WX_LOC_KEY, JSON.stringify(loc)); }catch{} }

// ─── WEATHER WIDGET ───────────────────────────────────────────────────────────
function WeatherWidget({theme}){
  const [loc,setLoc]=useState(getWeatherLocation);
  const [locating,setLocating]=useState(false);
  const [wx,setWx]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [lastFetch,setLastFetch]=useState(null);

  const fetchWeather=useCallback(async(where)=>{
    const place=where||getWeatherLocation();
    setLoading(true);setError(null);
    {
      try{
        const {lat,lon}=place;
        const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=5`;
        const res=await fetch(url);
        const d=await res.json();
        setWx(d);setLastFetch(Date.now());
      }catch{setError("Failed to load weather");}
      finally{setLoading(false);}
    }
  },[]);

  useEffect(()=>{fetchWeather();},[]);

  // Only asks for location permission when you tap 📍
  const useMyLocation=()=>{
    if(!navigator.geolocation){setError("Location not supported on this device");return;}
    setLocating(true);
    navigator.geolocation.getCurrentPosition(pos=>{
      const next={lat:+pos.coords.latitude.toFixed(3),lon:+pos.coords.longitude.toFixed(3),label:"Current location"};
      saveWeatherLocation(next);setLoc(next);setLocating(false);fetchWeather(next);
    },()=>{setLocating(false);setError("Location permission denied — still using "+getWeatherLocation().label);},{timeout:10000});
  };
  const resetHome=()=>{ saveWeatherLocation(DEFAULT_WX_LOC); setLoc(DEFAULT_WX_LOC); fetchWeather(DEFAULT_WX_LOC); };

  const wmoIcon=(code)=>{
    if(code===0)return"☀️";
    if(code<=2)return"🌤️";
    if(code<=3)return"☁️";
    if(code<=49)return"🌫️";
    if(code<=59)return"🌦️";
    if(code<=69)return"🌧️";
    if(code<=79)return"🌨️";
    if(code<=84)return"🌧️";
    if(code<=99)return"⛈️";
    return"🌡️";
  };
  const wmoDesc=(code)=>{
    if(code===0)return"Clear";if(code<=2)return"Partly cloudy";if(code<=3)return"Overcast";
    if(code<=49)return"Foggy";if(code<=59)return"Drizzle";if(code<=69)return"Rain";
    if(code<=79)return"Snow";if(code<=84)return"Rain showers";if(code<=99)return"Thunderstorm";
    return"Unknown";
  };

  if(loading)return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14,display:"flex",alignItems:"center",gap:10,color:theme.muted,fontSize:"0.82rem"}}>
      <span style={{fontSize:"1.2rem"}}>🌡️</span> {locating?"Finding you…":"Checking the sky…"}
    </div>
  );
  if(error)return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
      <span style={{color:theme.muted,fontSize:"0.8rem"}}>⚠️ {error}</span>
      <button onClick={()=>fetchWeather()} style={{background:theme.accent,border:"none",borderRadius:6,padding:"4px 10px",color:"#000",fontSize:"0.72rem",fontWeight:700,cursor:"pointer"}}>Retry</button>
    </div>
  );
  if(!wx)return null;

  const cur=wx.current;
  const daily=wx.daily;
  const dayNames=daily.time.slice(0,5).map((d,i)=>i===0?"Today":i===1?"Tomorrow":DAYS[new Date(d+"T12:00:00").getDay()]);

  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="Weather" accent={theme.accent} action={
        <div style={{display:"flex",gap:6}}>
          <button onClick={useMyLocation} title="Use my current location" style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.72rem",padding:"3px 8px"}}>📍</button>
          <button onClick={()=>fetchWeather()} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.72rem",padding:"3px 8px"}}>↻ Refresh</button>
        </div>
      }/>
      <div style={{fontSize:"0.68rem",color:theme.muted,marginTop:-6,marginBottom:8}}>
        {loc.label}{loc.label!==DEFAULT_WX_LOC.label&&<> · <span onClick={resetHome} style={{textDecoration:"underline",cursor:"pointer"}}>back to home</span></>}
      </div>
      {/* Current conditions */}
      <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:12}}>
        <div style={{fontSize:"3rem",lineHeight:1}}>{wmoIcon(cur.weather_code)}</div>
        <div>
          <div style={{fontSize:"2rem",fontWeight:700,color:theme.text,lineHeight:1}}>{Math.round(cur.temperature_2m)}°F</div>
          <div style={{fontSize:"0.8rem",color:theme.muted}}>Feels like {Math.round(cur.apparent_temperature)}°F · {wmoDesc(cur.weather_code)}</div>
          <div style={{fontSize:"0.75rem",color:theme.muted,marginTop:2}}>
            💧{cur.relative_humidity_2m}% · 💨{Math.round(cur.wind_speed_10m)}mph · 🌧{cur.precipitation_probability}%
          </div>
        </div>
        {lastFetch&&<div style={{marginLeft:"auto",fontSize:"0.65rem",color:theme.muted,alignSelf:"flex-start"}}>{timeAgo(lastFetch)}</div>}
      </div>
      {/* 5-day forecast */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:4}}>
        {dayNames.map((name,i)=>(
          <div key={i} style={{background:theme.bg,borderRadius:7,padding:"8px 4px",textAlign:"center"}}>
            <div style={{fontSize:"0.65rem",color:theme.muted,marginBottom:3,fontWeight:600}}>{name}</div>
            <div style={{fontSize:"1.1rem",lineHeight:1,marginBottom:3}}>{wmoIcon(daily.weather_code[i])}</div>
            <div style={{fontSize:"0.72rem",fontWeight:700,color:theme.text}}>{Math.round(daily.temperature_2m_max[i])}°</div>
            <div style={{fontSize:"0.65rem",color:theme.muted}}>{Math.round(daily.temperature_2m_min[i])}°</div>
            {daily.precipitation_probability_max[i]>20&&(
              <div style={{fontSize:"0.6rem",color:"#38bdf8",marginTop:2}}>🌧{daily.precipitation_probability_max[i]}%</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── NOTES PANEL ─────────────────────────────────────────────────────────────
function NotesPanel({notes,theme,onAdd,onUpdate,onDelete}){
  const [showNew,setShowNew]=useState(false);
  const [editing,setEditing]=useState(null);
  const [body,setBody]=useState("");
  const [title,setTitle]=useState("");
  const [pinned,setPinned]=useState(false);
  const [search,setSearch]=useState("");

  const openNew=()=>{setTitle("");setBody("");setPinned(false);setShowNew(true);setEditing(null);};
  const openEdit=n=>{setTitle(n.title||"");setBody(n.body);setPinned(!!n.pinned);setEditing(n.id);setShowNew(true);};
  const save=()=>{
    if(!body.trim())return;
    if(editing){onUpdate({...notes.find(n=>n.id===editing),title:title.trim(),body:body.trim(),pinned,updatedAt:Date.now()});}
    else{onAdd({id:genId(),title:title.trim(),body:body.trim(),pinned,createdAt:Date.now(),updatedAt:Date.now()});}
    setShowNew(false);setEditing(null);
  };

  const filtered=notes
    .filter(n=>!search||(n.title+n.body).toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.updatedAt||0)-(a.updatedAt||0));

  const pinned_notes=filtered.filter(n=>n.pinned);
  const regular=filtered.filter(n=>!n.pinned);

  const NoteCard=({n})=>(
    <div onClick={()=>openEdit(n)} style={{background:NOTE_COLORS[Math.abs(n.id.charCodeAt(0))%NOTE_COLORS.length],border:`1px solid ${theme.border}`,borderRadius:8,padding:"10px 12px",cursor:"pointer",position:"relative",transition:"transform 0.1s"}}>
      {n.pinned&&<span style={{position:"absolute",top:6,right:8,fontSize:"0.7rem"}}>📌</span>}
      {n.title&&<div style={{fontSize:"0.82rem",fontWeight:700,color:theme.text,marginBottom:4,paddingRight:16}}>{n.title}</div>}
      <div style={{fontSize:"0.78rem",color:"#94a3b8",lineHeight:1.5,display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{n.body}</div>
      <div style={{fontSize:"0.63rem",color:theme.muted,marginTop:6}}>{timeAgo(n.updatedAt||n.createdAt||0)}</div>
    </div>
  );

  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title={`Notes${notes.length?" ("+notes.length+")":""}`} accent={theme.accent} action={
        <button onClick={openNew} style={{background:theme.accent,border:"none",borderRadius:6,color:"#000",fontSize:"0.75rem",fontWeight:700,padding:"4px 10px",cursor:"pointer"}}>+ Note</button>
      }/>
      {notes.length>3&&(
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search notes…"
          style={{width:"100%",background:theme.bg,border:`1px solid ${theme.border}`,borderRadius:7,padding:"7px 10px",color:theme.text,fontSize:"0.8rem",marginBottom:10,boxSizing:"border-box",outline:"none"}}/>
      )}
      {filtered.length===0&&<p style={{color:theme.muted,fontSize:"0.8rem",textAlign:"center",padding:"8px 0"}}>{QUIPS.emptyNotes}</p>}
      {pinned_notes.length>0&&(
        <div style={{marginBottom:8}}>
          <div style={{fontSize:"0.65rem",color:theme.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:5}}>Pinned</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>{pinned_notes.map(n=><NoteCard key={n.id} n={n}/>)}</div>
        </div>
      )}
      {regular.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>{regular.map(n=><NoteCard key={n.id} n={n}/>)}</div>
      )}
      {showNew&&(
        <Modal title={editing?"Edit Note":"New Note"} onClose={()=>{setShowNew(false);setEditing(null);}} theme={theme}>
          <Inp label="Title (optional)" value={title} onChange={e=>setTitle(e.target.value)} placeholder="Quick title…"/>
          <Inp label="Note" as="textarea" value={body} onChange={e=>setBody(e.target.value)} placeholder="Write anything…" minHeight={120}/>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <button onClick={()=>setPinned(p=>!p)} style={{background:pinned?`${theme.accent}22`:"transparent",border:`1px solid ${pinned?theme.accent:theme.border}`,borderRadius:6,padding:"5px 10px",color:pinned?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.78rem"}}>
              {pinned?"📌 Pinned":"📌 Pin note"}
            </button>
            {editing&&<button onClick={()=>{onDelete(editing);setShowNew(false);setEditing(null);}} style={{marginLeft:"auto",background:"none",border:"1px solid #ef444433",borderRadius:6,color:"#ef4444",cursor:"pointer",fontSize:"0.72rem",padding:"5px 10px",opacity:0.8}}>Delete</button>}
          </div>
          <button onClick={save} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.9rem"}}>Save Note</button>
        </Modal>
      )}
    </div>
  );
}

// ─── TODAY SUMMARY ────────────────────────────────────────────────────────────
function TodaySummary({events,todos,habits,projects,theme}){
  const [show,setShow]=useState(true);
  const today=todayStr(),todayDow=new Date().getDay();
  const now=new Date(),nowMins=now.getHours()*60+now.getMinutes();

  const todayEvents=[...events]
    .filter(e=>e.date===today)
    .sort((a,b)=>(a.time||"").localeCompare(b.time||""));

  const urgentTodos=todos.filter(t=>!t.completed&&(t.dueDate===today||t.priority==="high")).slice(0,5);

  const todayHabits=habits.filter(h=>isHabitScheduled(h,today));
  const habitsDone=todayHabits.filter(h=>h.completions?.[today]).length;

  const nextEvents=todayEvents.filter(e=>{
    if(!e.time)return true;
    const[h,m]=e.time.split(":").map(Number);return h*60+m>=nowMins;
  });

  const activeProjects=projects.filter(p=>p.status==="active");
  const projectSuggestions=activeProjects.flatMap(p=>{
    const next=p.type==="linear"?p.steps.find(s=>!s.done):p.steps.filter(s=>!s.done)[0];
    return next&&next.mins<=60?[{project:p,step:next}]:[];
  }).slice(0,2);

  // Project nudges for Today view
  const nudgeProjects=(projects||[]).filter(p=>{
    if(p.status!=="active"||!p.nudgeDays)return false;
    return projectIdle(p,habits).overdue;
  });

  const isEmpty=todayEvents.length===0&&urgentTodos.length===0&&todayHabits.length===0&&nudgeProjects.length===0;

  return(
    <div style={{background:theme.panel,border:`1.5px solid ${theme.accent}44`,borderRadius:10,padding:14}}>

                  return(
                    <div key={ev.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:theme.bg,borderRadius:7,borderLeft:`3px solid ${CATEGORY_COLORS[ev.category]||"#64748b"}`,opacity:isPast?0.45:1}}>
                      <span style={{fontSize:"0.85rem",flexShrink:0}}>{CATEGORY_ICONS[ev.category]||"📌"}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:"0.83rem",fontWeight:600,color:theme.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ev.title}</div>
                        {ev.time&&<div style={{fontSize:"0.68rem",color:theme.muted}}>{formatTime(ev.time)}</div>}
                      </div>
                      {isPast&&<span style={{fontSize:"0.65rem",color:theme.muted,flexShrink:0}}>done</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Habits progress */}
          {todayHabits.length>0&&(
            <div style={{marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5}}>
                <div style={{fontSize:"0.68rem",color:theme.muted,textTransform:"uppercase",letterSpacing:"0.08em"}}>Habits</div>

                  </div>

              </div>

                          {nudgeMessage(p,habits)}
                        </div>
                      </div>
                    </div>
