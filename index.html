              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:"1.1rem",fontWeight:800,color:monthEarned?"#f59e0b":theme.text}}>{monthStats.pct}%</div>
                <div style={{fontSize:"0.62rem",color:theme.muted}}>need {goalRewards?.monthly?.pctRequired||80}%</div>
              </div>
            </div>
            <div style={{height:6,background:theme.panel,borderRadius:4,marginBottom:8,overflow:"hidden"}}>
              <div style={{height:"100%",background:monthEarned?"#f59e0b":monthStats.pct>=(goalRewards?.monthly?.pctRequired||80)*0.8?"#f97316":"#ef4444",borderRadius:4,width:monthStats.pct+"%",transition:"width 0.5s"}}/>
            </div>
            <div style={{fontSize:"0.68rem",color:theme.muted,marginBottom:8,textAlign:"center"}}>
              {monthStats.days} perfect days out of {monthStats.total} tracked · need {Math.ceil(((goalRewards?.monthly?.pctRequired||80)/100)*monthStats.total)-monthStats.days > 0 ? Math.ceil(((goalRewards?.monthly?.pctRequired||80)/100)*monthStats.total)-monthStats.days+" more" : "already there 🔥"}
            </div>
            {monthEarned && !monthAlreadyClaimed && goalRewards?.monthly?.restaurant && (
              <button onClick={claimMonthly} style={{width:"100%",background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",borderRadius:7,padding:"9px",color:"#000",fontWeight:800,cursor:"pointer",fontSize:"0.85rem"}}>
                🎉 EARNED IT — Claim {goalRewards.monthly.restaurant}
              </button>
            )}
            {monthAlreadyClaimed && (
              <div style={{textAlign:"center",fontSize:"0.75rem",color:"#f59e0b",fontWeight:700}}>✓ Claimed this month — you deserved that one</div>
            )}
          </div>

        </div>
      )}
    </div>
  );
}

// ─── CLINICAL SPANISH PANEL ──────────────────────────────────────────────────
function SpanishPanel({habits, spanishTrack, theme, onSetProgress, onPassCheckpoint}){
  const [show,setShow]=useState(true);
  const [confirming,setConfirming]=useState(false);
  const [open,setOpen]=useState(null); // "plan" | "phrases" | null
  const [section,setSection]=useState(0);
  const [revealed,setRevealed]=useState({});
  const [revealAll,setRevealAll]=useState(false);
  const today=todayStr();
  const started=today>=SPANISH_TRACK.startDate;
  const week=spanishWeekStatus(habits, getCurrentWeekKey());
  const th=trackHabits(habits);
  const pim=th.find(h=>h.id==="pimsleur-daily");
  const {kept}=spanishWeeksKept(habits);
  const pr=spanishProgress(spanishTrack);
  const info=spanishStageInfo(pr.stage); // null = maintenance
  const N=SPANISH_TRACK.lessonsPerLevel, LT=SPANISH_TRACK.languaTotal;
  const todayItems=th.filter(h=>isHabitScheduled(h,today));
  const red="#ef4444", green="#22c55e", amber="#f59e0b";
  const btn={background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.72rem",padding:"3px 8px"};
  const btnOn={...btn,background:amber,color:"#000",border:"none",fontWeight:700};
  const label={fontSize:"0.62rem",color:theme.muted,textTransform:"uppercase",letterSpacing:"0.08em"};
  const row={display:"flex",alignItems:"center",gap:8,padding:"7px 8px",background:theme.bg,borderRadius:7};
  if(!th.length) return null;

  // Pimsleur counter (level can be redone below the current stage; can't pass the stage's level without its checkpoint)
  const pimDone=!info;
  const atLevelEnd=pr.pimsleurLesson>=N && pr.pimsleurLevel>=Math.min(pr.stage,5);
  const pimNext=()=>{ if(pr.pimsleurLesson<N) onSetProgress({pimsleurLesson:pr.pimsleurLesson+1});
    else if(pr.pimsleurLevel<Math.min(pr.stage,5)) onSetProgress({pimsleurLevel:pr.pimsleurLevel+1,pimsleurLesson:1}); };
  const pimBack=()=>{ if(pr.pimsleurLesson>1) onSetProgress({pimsleurLesson:pr.pimsleurLesson-1});
    else if(pr.pimsleurLevel>1) onSetProgress({pimsleurLevel:pr.pimsleurLevel-1,pimsleurLesson:N}); };
  const languaAllDone=pr.languaLesson>LT;
  const languaAhead=info?.languaEnd && pr.languaLesson>info.languaEnd;

  let weekLine, weekColor;
  const minText=`Minimum: Pimsleur ${week.got.pimsleur}/${week.need.pimsleur} · Langua ${week.got.langua}/${week.need.langua}`;
  if(!started){ weekLine="Starts "+new Date(SPANISH_TRACK.startDate+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); weekColor=theme.muted; }
  else if(week.fullKept){ weekLine="Full week kept"; weekColor=green; }
  else if(week.minimumKept){ weekLine="Minimum kept · rest is bonus"; weekColor=amber; }
  else if(week.minimumAlive){ weekLine=minText; weekColor=theme.muted; }
  else { weekLine="Minimum missed this week — don't double up, just do the next lesson"; weekColor=red; }

  const stepper=(text,sub,onBack,onNext,nextLabel,nextDisabled)=>(
    <div style={{...row,marginBottom:5}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:"0.82rem",fontWeight:700,color:theme.text}}>{text}</div>
        {sub&&<div style={{fontSize:"0.64rem",color:theme.muted,lineHeight:1.35,marginTop:1}}>{sub}</div>}
      </div>
      {onBack&&<button onClick={onBack} style={btn} title="Go back">−</button>}
      {onNext&&<button onClick={onNext} disabled={nextDisabled} style={{...btn,opacity:nextDisabled?0.4:1,cursor:nextDisabled?"default":"pointer",color:nextDisabled?theme.muted:amber,borderColor:nextDisabled?theme.border:amber}}>{nextLabel}</button>}
    </div>
  );

  const pb=SPANISH_TRACK.phraseBank[section];

  return(
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="🇪🇸 Clinical Spanish" accent={amber} action={
        <button onClick={()=>setShow(s=>!s)} style={btn}>{show?"Collapse":"Expand"}</button>
      }/>
      <div style={{fontSize:"0.72rem",color:theme.muted,marginTop:-4,marginBottom:10}}>{SPANISH_TRACK.goal}</div>

      {/* Stats row */}
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        {[["Stage",info?pr.stage+"/5":"Done","🧭"],["Pimsleur",pim?habitStreak(pim):0,"🔥"],["Weeks kept",kept,"✅"],["This week",week.done+"/"+week.total,"📅"]].map(([l,v,i])=>(
          <div key={l} style={{flex:1,background:theme.bg,borderRadius:7,padding:"6px 4px",textAlign:"center"}}>
            <div style={{fontSize:"0.9rem",fontWeight:700,color:theme.text}}>{i}{v}</div>
            <div style={{fontSize:"0.58rem",color:theme.muted}}>{l}</div>
          </div>
        ))}
      </div>

      {show && <>
        {/* Where you are */}
        <div style={{...label,marginBottom:5}}>Where you are</div>
        {pimDone
          ? stepper("Pimsleur · all 5 levels done", "Maintenance: Saturday roleplay + Sunday podcast.")
          : stepper(`Pimsleur · Level ${pr.pimsleurLevel}, Lesson ${pr.pimsleurLesson}/${N}`,
              atLevelEnd ? "Level done. Pass the checkpoint below to move on, or redo lessons with −."
                         : "After each lesson: ~80% on time → Next. Otherwise repeat it tomorrow.",
              (pr.pimsleurLesson>1||pr.pimsleurLevel>1)?pimBack:null, pimNext, "Next ›", atLevelEnd)}
        {info && pr.stage<=3
          ? stepper(languaAllDone?`Langua · all ${LT} lessons done`:`Langua · Lesson ${pr.languaLesson}/${LT}`,
              languaAhead ? "Ahead of Pimsleur. Weekends: redo Langua lessons, free conversation, or a Langua podcast until Pimsleur catches up."
                          : `This stage: ${info.langua}. Save any word you'd use with a family.`,
              pr.languaLesson>1?()=>onSetProgress({languaLesson:pr.languaLesson-1}):null,
              ()=>onSetProgress({languaLesson:pr.languaLesson+1}), "Done ›", languaAllDone)
          : info && stepper("Weekends", info.langua)}
        {info && (
          <div style={{...row,marginBottom:10,border:`1px solid ${amber}44`}}>
            <span style={{fontSize:"1.1rem"}}>🧭</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"0.66rem",color:amber,fontWeight:700}}>STAGE {pr.stage} CHECKPOINT</div>
              <div style={{fontSize:"0.78rem",color:theme.text,lineHeight:1.35}}>{info.checkpoint}</div>
            </div>
            {confirming
              ? <><button onClick={()=>{onPassCheckpoint(pr.stage);setConfirming(false);}} style={btnOn}>Confirm</button>
                  <button onClick={()=>setConfirming(false)} style={btn}>✕</button></>
              : <button onClick={()=>setConfirming(true)} style={btn}>Passed</button>}
          </div>
        )}

        {/* Week strip */}
        <div style={{display:"flex",gap:4,marginBottom:6}}>
          {week.days.map((d,i)=>{
            const isToday=d.ds===today, past=d.ds<today;
            return(
              <div key={d.ds} style={{flex:1,textAlign:"center",padding:"5px 0",borderRadius:7,background:isToday?`${amber}22`:theme.bg,border:`1px solid ${isToday?amber:"transparent"}`}}>
                <div style={{fontSize:"0.58rem",color:isToday?amber:theme.muted,fontWeight:isToday?700:400}}>{["M","T","W","T","F","S","S"][i]}</div>
                <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:2,marginTop:3,minHeight:8}}>
                  {d.items.map(it=>(
                    <span key={it.id} title={it.title} style={{width:7,height:7,borderRadius:"50%",background:it.done?green:past&&d.ds>=SPANISH_TRACK.startDate?red:theme.border}}/>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{fontSize:"0.7rem",color:weekColor,fontWeight:600,marginBottom:10}}>{weekLine}</div>

        {/* Today */}
        {started && (
          <div style={{marginBottom:10}}>
            <div style={{...label,marginBottom:4}}>Today</div>
            {todayItems.length===0
              ? <div style={{fontSize:"0.78rem",color:theme.muted}}>Nothing scheduled. Even gremlins sleep. (We don't.)</div>
              : todayItems.map(h=>(
                <div key={h.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:"0.78rem",color:theme.text,padding:"2px 0"}}>
                  <span style={{color:h.completions?.[today]?green:theme.muted}}>{h.completions?.[today]?"✓":"○"}</span>
                  <span style={{flex:1,textDecoration:h.completions?.[today]?"line-through":"none",opacity:h.completions?.[today]?0.6:1}}>{h.title}</span>
                  <span style={{fontSize:"0.62rem",color:theme.muted}}>{[h.durationMin&&fmtMins(h.durationMin),h.reminderTime&&formatTime(h.reminderTime)].filter(Boolean).join(" · ")}</span>
                </div>
              ))}
            {todayItems.length>0&&<div style={{fontSize:"0.6rem",color:theme.muted,marginTop:3}}>Check these off in Daily Habits. Speak out loud every time.</div>}
          </div>
        )}

        {/* Plan + phrase bank toggles */}
        <div style={{display:"flex",gap:6,marginBottom:open?8:0}}>
          <button onClick={()=>setOpen(o=>o==="plan"?null:"plan")} style={open==="plan"?btnOn:btn}>📋 Plan & rules</button>
          <button onClick={()=>setOpen(o=>o==="phrases"?null:"phrases")} style={open==="phrases"?btnOn:btn}>🗣️ Phrase bank</button>
        </div>

        {open==="plan" && (
          <div style={{fontSize:"0.72rem",color:theme.text,lineHeight:1.45}}>
            <div style={{...label,margin:"4px 0"}}>The 3 rules</div>
            {SPANISH_TRACK.rules.map((r,i)=><div key={i}><b style={{color:amber}}>{i+1}.</b> {r}</div>)}
            <div style={{...label,margin:"8px 0 4px"}}>Good to know</div>
            {SPANISH_TRACK.notes.map((n,i)=><div key={i} style={{color:theme.muted,marginBottom:2}}>• {n}</div>)}
            <div style={{...label,margin:"8px 0 4px"}}>Roadmap</div>
            {SPANISH_TRACK.stages.map(s=>{
              const passed=spanishTrack?.checkpoints?.[s.stage], cur=s.stage===pr.stage;
              return(
                <div key={s.stage} style={{...row,marginBottom:4,border:`1px solid ${cur?amber+"66":"transparent"}`,opacity:passed?0.65:1}}>
                  <span style={{color:passed?green:cur?amber:theme.muted,fontWeight:700,width:16}}>{passed?"✓":s.stage}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:"0.74rem",color:theme.text}}>Pimsleur Level {s.pimsleurLevel} · {s.langua}</div>
                    <div style={{fontSize:"0.64rem",color:theme.muted}}>Checkpoint: {s.checkpoint}{passed?" · passed "+formatDate(passed):""}</div>
                  </div>
                </div>
              );
            })}
            <div style={{color:theme.muted,fontSize:"0.66rem",marginBottom:6}}>After Level 5: keep the Saturday roleplay + Sunday podcast to maintain.</div>
            <div style={{...label,margin:"8px 0 4px"}}>Optional extras (don't count toward the 35 min)</div>
            {SPANISH_TRACK.optional.map((o,i)=><div key={i} style={{color:theme.muted,marginBottom:2}}>• {o}</div>)}
            <div style={{marginTop:8,padding:"6px 8px",borderRadius:6,background:`${red}14`,border:`1px solid ${red}44`,color:theme.text,fontSize:"0.68rem"}}>⚠️ {SPANISH_TRACK.safety}</div>
          </div>
        )}

        {open==="phrases" && (
          <div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>
              {SPANISH_TRACK.phraseBank.map((p,i)=>(
                <button key={p.section} onClick={()=>{setSection(i);setRevealed({});setRevealAll(false);}} style={i===section?{...btnOn,fontSize:"0.68rem"}:{...btn,fontSize:"0.68rem"}}>{p.section}</button>
              ))}
            </div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <div style={{fontSize:"0.64rem",color:theme.muted}}>Say it from the English, then tap to check. <b>Usted</b> with parents, <b>tú</b> with the child.</div>
              <button onClick={()=>{setRevealAll(r=>!r);setRevealed({});}} style={{...btn,flexShrink:0}}>{revealAll?"Hide all":"Show all"}</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}>
              {pb.rows.map(([en,es],i)=>{
                const vis=revealAll||revealed[i];
                return(
                  <div key={i} onClick={()=>setRevealed(r=>({...r,[i]:!r[i]}))} style={{...row,cursor:"pointer",flexDirection:"column",alignItems:"stretch",gap:2}}>
                    <div style={{fontSize:"0.76rem",color:theme.text}}>{en}</div>
                    <div style={{fontSize:"0.78rem",fontWeight:600,color:vis?amber:theme.muted,fontStyle:vis?"normal":"italic"}}>{vis?es:"tap to reveal"}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </>}
    </div>
  );
}

// ─── DAILY UNLOCK PANEL ──────────────────────────────────────────────────────
function DailyUnlockPanel({habits, todos, dailyUnlock, theme, onSave, onToast}){
  const du = dailyUnlock || DEFAULT_DATA.dailyUnlock;
  const today = todayStr();
  const status = calcDailyUnlock(habits, todos, today);
  const claimedToday = !!du.claims?.[today];
  const streak = calcClaimStreak(du.claims);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({title:du.title, emoji:du.emoji});
  const [lockLine] = useState(()=>quip("dailyLocked"));
  const [celebrate, setCelebrate] = useState(false);
  const [claimLine, setClaimLine] = useState("");

  // Announce the moment the last task gets checked (not on page load)
  const prevUnlocked = useRef(status.unlocked);
  useEffect(()=>{
    if(status.unlocked && !prevUnlocked.current && !claimedToday && status.total>0){
      onToast("🔓 "+quip("dailyUnlocked"));
    }
    prevUnlocked.current = status.unlocked;
  },[status.unlocked]);

  const green = "#22c55e";
  const accent = claimedToday ? theme.muted : status.unlocked ? green : theme.accent;
  const pct = status.total ? Math.round(status.done/status.total*100) : 100;
  const remaining = status.items.filter(i=>!i.done);

  const claim = () => {
    const claims = {...(du.claims||{}), [today]:true};
    const newStreak = calcClaimStreak(claims);
    onSave({...du, claims, bestStreak:Math.max(du.bestStreak||0,newStreak)});
    setClaimLine(quip("dailyClaimed"));
    setCelebrate(true);
  };
  const undo = () => {
    const claims = {...(du.claims||{})}; delete claims[today];
    onSave({...du, claims});
  };
  const saveForm = () => {
    onSave({...du, title:form.title.trim()||du.title, emoji:form.emoji.trim()||du.emoji});
    setEditing(false);
  };

  const btn = {background:"none",border:`1px solid ${theme.border}`,borderRadius:6,color:theme.muted,cursor:"pointer",fontSize:"0.72rem",padding:"3px 8px"};

  return(
    <div style={{background:theme.panel,border:`1px solid ${status.unlocked&&!claimedToday?green:theme.border}`,borderRadius:10,padding:14,
      boxShadow:status.unlocked&&!claimedToday?`0 0 24px ${green}33`:"none",transition:"box-shadow 0.4s, border-color 0.4s"}}>
      <SectionHeader title="Daily Unlock" accent={accent} action={
        <button onClick={()=>{setForm({title:du.title,emoji:du.emoji});setEditing(e=>!e);}} style={btn}>{editing?"Cancel":"Edit"}</button>
      }/>

      {editing ? (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <div style={{display:"flex",gap:8}}>
            <input value={form.emoji} onChange={e=>setForm({...form,emoji:e.target.value})} maxLength={4}
              style={{width:52,textAlign:"center",background:theme.bg,border:`1px solid ${theme.border}`,borderRadius:7,padding:"8px",color:theme.text,fontSize:"1.1rem"}}/>
            <input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="What you're earning"
              style={{flex:1,background:theme.bg,border:`1px solid ${theme.border}`,borderRadius:7,padding:"8px 10px",color:theme.text,fontSize:"0.85rem"}}/>
          </div>
          <div style={{fontSize:"0.68rem",color:theme.muted}}>Unlocks when every habit scheduled today and every to-do due today is checked off.</div>
          <button onClick={saveForm} style={{background:theme.accent,border:"none",borderRadius:8,padding:"9px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.85rem"}}>Save</button>
        </div>
      ) : (
        <>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
            <div style={{fontSize:"2rem",lineHeight:1,filter:status.unlocked||claimedToday?"none":"grayscale(1)",opacity:status.unlocked||claimedToday?1:0.45,transition:"all 0.4s"}}>
              {du.emoji}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"0.95rem",fontWeight:800,color:theme.text}}>{du.title}</div>
              <div style={{fontSize:"0.72rem",color:accent,fontWeight:700,letterSpacing:"0.04em"}}>
                {claimedToday ? "✓ CLAIMED TODAY" : status.unlocked ? "🔓 UNLOCKED" : `🔒 ${status.done}/${status.total} DONE`}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:"0.9rem",fontWeight:700,color:"#f97316"}}>🔥{streak}</div>
              <div style={{fontSize:"0.58rem",color:theme.muted}}>best {Math.max(du.bestStreak||0,streak)}</div>
            </div>
          </div>

          {!claimedToday && (
            <div style={{height:6,background:theme.border,borderRadius:4,overflow:"hidden",marginBottom:10}}>
              <div style={{height:"100%",width:pct+"%",background:status.unlocked?green:theme.accent,borderRadius:4,transition:"width 0.5s"}}/>
            </div>
          )}

          {!status.unlocked && !claimedToday && (()=>{
            const h=remaining.filter(i=>i.kind==="habit").length, t=remaining.filter(i=>i.kind==="todo").length;
            const parts=[h&&`${h} habit${h>1?"s":""}`, t&&`${t} to-do${t>1?"s":""}`].filter(Boolean).join(" + ");
            return <div style={{fontSize:"0.72rem",color:theme.muted}}>{parts} left · marked 🔒 below. <span style={{fontStyle:"italic"}}>{lockLine}</span></div>;
          })()}

          {status.unlocked && !claimedToday && (
            <button onClick={claim} style={{width:"100%",background:green,border:"none",borderRadius:8,padding:"11px",color:"#000",fontWeight:800,cursor:"pointer",fontSize:"0.9rem"}}>
              Claim {du.emoji} {du.title}
            </button>
          )}

          {claimedToday && (
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <div style={{fontSize:"0.75rem",color:theme.muted}}>{QUIPS.claimedNote}</div>
              <button onClick={undo} style={btn}>Undo</button>
            </div>
          )}
        </>
      )}

      {celebrate && (
        <div onClick={()=>setCelebrate(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:4000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:theme.panel,border:`2px solid ${green}`,borderRadius:16,padding:"28px 24px",maxWidth:340,width:"100%",textAlign:"center",boxShadow:`0 0 60px ${green}44`}}>
            <div style={{fontSize:"3rem",marginBottom:8}}>{du.emoji}</div>
            <div style={{fontSize:"1.15rem",fontWeight:800,color:green,marginBottom:8}}>DAILY UNLOCK CLAIMED</div>
            <div style={{fontSize:"0.88rem",color:theme.text,marginBottom:14,lineHeight:1.5}}>{claimLine}</div>
            <div style={{fontSize:"0.75rem",color:theme.muted,marginBottom:16}}>🔥 {calcClaimStreak({...(du.claims||{}),[today]:true})}-day streak</div>
            <button onClick={()=>setCelebrate(false)} style={{background:green,border:"none",borderRadius:8,padding:"10px 24px",color:"#000",fontWeight:800,cursor:"pointer",fontSize:"0.9rem"}}>Enjoy it</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── GOAL REWARD CELEBRATION ──────────────────────────────────────────────────
function GoalRewardCelebration({type, restaurant, theme, accent, onClose}){
  useEffect(()=>{const t=setTimeout(onClose,8000);return()=>clearTimeout(t);},[onClose]);
  const isWeekly = type==="weekly";
  const msgs = isWeekly ? [
    "EVERY. SINGLE. DAY. You absolute unhinged machine.",
    "7 perfect days. That's not luck, that's a lifestyle. A deranged, beautiful lifestyle.",
    "WEEKLY GOAL OBLITERATED. The restaurant has been earned. Alert the chefs.",
    "Perfect week. I've updated your file. The file is now glowing. That's probably fine.",
  ] : [
    "MONTHLY GOAL CRUSHED. A full month. I need to lie down and I don't have a body.",
    "Month complete. The numbers confirm what I suspected: you're built different. Possibly cursed.",
    "MONTHLY TARGET HIT. That meal? You didn't just earn it. You CONQUERED it.",
    "Monthly goal achieved. Go eat something incredible. Zero guilt. Maximum gremlin energy.",
  ];
  const [msg] = useState(()=>msgs[Math.floor(Math.random()*msgs.length)]);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:4000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}>

        <div style={{fontSize:"3rem",marginBottom:8}}>{isWeekly?"🏆":"👑"}</div>
        <div style={{fontSize:"1.2rem",fontWeight:800,color:isWeekly?"#22c55e":"#f59e0b",marginBottom:8}}>
          {isWeekly?"WEEKLY GOAL":"MONTHLY GOAL"} ACHIEVED
        </div>
        <div style={{fontSize:"0.88rem",color:theme.text,marginBottom:12,lineHeight:1.5}}>{msg}</div>
        <div style={{background:isWeekly?"#22c55e22":"#f59e0b22",border:`1px solid ${isWeekly?"#22c55e":"#f59e0b"}`,borderRadius:9,padding:"12px",marginBottom:16}}>
          <div style={{fontSize:"0.7rem",color:theme.muted,marginBottom:3}}>Your reward</div>

}

const REWARD_CATEGORIES = { food:"🍕 Food & Drink", experience:"✨ Experiences", gear:"🛠️ Gear" };

function RewardStorePanel({rewards, rewardStore, theme, onRedeem, onAdd, onDelete, onEdit}){
  const [showAdd, setShowAdd] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [redeemAnim, setRedeemAnim] = useState(null);
  const [filter, setFilter] = useState("all");
  const [form, setForm] = useState({title:"", emoji:"🎁", desc:"", cost:200, category:"experience"});
  const spendable = rewards?.spendableXp || 0;
  const total = rewards?.xp || 0;

  const openAdd = () => { setForm({title:"", emoji:"🎁", desc:"", cost:200, category:"experience"}); setEditItem(null); setShowAdd(true); };
  const openEdit = (r) => { setForm({...r}); setEditItem(r.id); setShowAdd(true); };

  const save = () => {
    if(!form.title.trim()) return;
    if(editItem){ onEdit({...form, id:editItem}); }
    else { onAdd({...form, id:genId(), redeemed:0}); }
    setShowAdd(false); setEditItem(null);
  };

  const handleRedeem = (item) => {
    if(spendable < item.cost){ return; }
    setRedeemAnim(item.id);
    setTimeout(()=>{ onRedeem(item.id); setRedeemAnim(null); }, 800);
  };

  const categories = ["all", "food", "experience", "gear"];
  const filtered = (rewardStore||[]).filter(r => filter==="all" || r.category===filter);
  const affordable = filtered.filter(r => r.cost <= spendable);
  const locked = filtered.filter(r => r.cost > spendable);

  const RewardCard = ({item}) => {
    const canAfford = spendable >= item.cost;
    const isAnimating = redeemAnim === item.id;
    const pct = Math.min(100, Math.round((spendable/item.cost)*100));
    return (
      <div style={{background:isAnimating?"#22c55e22":theme.bg, border:`1px solid ${isAnimating?"#22c55e":canAfford?theme.accent+"44":theme.border}`, borderRadius:10, padding:"12px", transition:"all 0.3s", position:"relative"}}>
        {isAnimating && <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"2rem",zIndex:10}}>🎉</div>}
        <div style={{display:"flex",alignItems:"flex-start",gap:10,opacity:isAnimating?0.3:1}}>
          <div style={{fontSize:"1.8rem",flexShrink:0,lineHeight:1}}>{item.emoji}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
              <div style={{fontSize:"0.85rem",fontWeight:700,color:theme.text}}>{item.title}</div>
              <div style={{display:"flex",gap:4,flexShrink:0}}>
                <button onClick={()=>openEdit(item)} style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.7rem",padding:"0 3px"}}>✎</button>
                <button onClick={()=>onDelete(item.id)} style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.7rem",padding:"0 3px",opacity:0.5}}>✕</button>
              </div>
            </div>
            <div style={{fontSize:"0.75rem",color:theme.muted,marginBottom:8,lineHeight:1.4}}>{item.desc}</div>
            {item.redeemed>0 && <div style={{fontSize:"0.65rem",color:"#22c55e",marginBottom:6}}>✓ Redeemed {item.redeemed}x</div>}
            {!canAfford && (
              <div style={{marginBottom:6}}>
                <div style={{height:3,background:theme.panel,borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",background:theme.accent,width:pct+"%",borderRadius:4,transition:"width 0.4s"}}/>
                </div>
                <div style={{fontSize:"0.63rem",color:theme.muted,marginTop:2}}>{spendable}/{item.cost} XP — need {item.cost-spendable} more</div>
              </div>
            )}
            <button onClick={()=>handleRedeem(item)} disabled={!canAfford||isAnimating}
              style={{width:"100%",background:canAfford?`linear-gradient(135deg,${theme.accent},#a78bfa)`:"transparent",border:`1.5px solid ${canAfford?theme.accent:theme.border}`,borderRadius:7,padding:"7px",color:canAfford?"#000":theme.muted,fontWeight:canAfford?700:400,cursor:canAfford?"pointer":"not-allowed",fontSize:"0.78rem",transition:"all 0.2s"}}>
              {canAfford ? "⚡ Redeem — "+item.cost+" XP" : "🔒 "+item.cost+" XP"}
            </button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div style={{background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:10,padding:14}}>
      <SectionHeader title="Reward Store" accent={theme.accent} action={
        <button onClick={openAdd} style={{background:theme.accent,border:"none",borderRadius:6,color:"#000",fontSize:"0.75rem",fontWeight:700,padding:"4px 10px",cursor:"pointer"}}>+ Add</button>
      }/>

      {/* Spendable XP balance */}
      <div style={{background:theme.bg,borderRadius:9,padding:"10px 12px",marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div style={{fontSize:"0.68rem",color:theme.muted,marginBottom:2}}>Available to spend</div>
          <div style={{fontSize:"1.4rem",fontWeight:800,color:theme.accent}}>⚡ {spendable} XP</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:"0.68rem",color:theme.muted,marginBottom:2}}>Total earned</div>
          <div style={{fontSize:"0.85rem",fontWeight:700,color:theme.muted}}>{total} XP</div>
        </div>
      </div>

      {/* Category filter */}
      <div style={{display:"flex",gap:4,marginBottom:12,overflowX:"auto"}}>
        {categories.map(c=>(
          <button key={c} onClick={()=>setFilter(c)}
            style={{padding:"4px 10px",borderRadius:20,border:`1px solid ${filter===c?theme.accent:theme.border}`,background:filter===c?`${theme.accent}22`:"transparent",color:filter===c?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.72rem",whiteSpace:"nowrap",fontWeight:filter===c?700:400}}>
            {c==="all"?"All":REWARD_CATEGORIES[c]||c}
          </button>
        ))}
      </div>

      {filtered.length===0 && <p style={{color:theme.muted,fontSize:"0.8rem",textAlign:"center",padding:"10px 0"}}>No rewards yet. Add something worth working for.</p>}

      {/* Affordable rewards */}
      {affordable.length>0 && (
        <div style={{marginBottom:12}}>
          {affordable.length>0 && locked.length>0 && <div style={{fontSize:"0.68rem",color:"#22c55e",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>✓ You can afford these</div>}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {affordable.map(r=><RewardCard key={r.id} item={r}/>)}
          </div>
        </div>
      )}

      {/* Locked rewards */}
      {locked.length>0 && (
        <div>
          {affordable.length>0 && <div style={{fontSize:"0.68rem",color:theme.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>🔒 Keep earning</div>}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {locked.map(r=><RewardCard key={r.id} item={r}/>)}
          </div>
        </div>
      )}

      {/* Add/Edit modal */}
      {showAdd && (
        <Modal title={editItem?"Edit Reward":"New Reward"} onClose={()=>{setShowAdd(false);setEditItem(null);}} theme={theme}>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:4}}>Emoji</label>
            <input value={form.emoji} onChange={e=>setForm({...form,emoji:e.target.value})}
              style={{width:60,background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:7,padding:"8px",color:"#e2e8f0",fontSize:"1.2rem",textAlign:"center"}}/>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:4}}>Reward Name</label>
            <input value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="e.g. Nice dinner out"
              style={{width:"100%",background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:7,padding:"8px 10px",color:"#e2e8f0",fontSize:"0.85rem",boxSizing:"border-box"}}/>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:4}}>Description</label>
            <textarea value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})} placeholder="What does this mean to you?"
              style={{width:"100%",background:"#1a2540",border:"1px solid #2d3f5a",borderRadius:7,padding:"8px 10px",color:"#e2e8f0",fontSize:"0.82rem",resize:"vertical",minHeight:60,boxSizing:"border-box"}}/>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:"0.73rem",color:"#94a3b8",marginBottom:6}}>Category</label>
            <div style={{display:"flex",gap:6}}>
              {Object.entries(REWARD_CATEGORIES).map(([k,v])=>(
                <button key={k} onClick={()=>setForm({...form,category:k})}
                  style={{flex:1,padding:"6px 4px",borderRadius:7,border:`1.5px solid ${form.category===k?theme.accent:theme.border}`,background:form.category===k?`${theme.accent}22`:"transparent",color:form.category===k?theme.accent:theme.muted,cursor:"pointer",fontSize:"0.7rem",textAlign:"center"}}>{v}</button>
              ))}
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
              <label style={{fontSize:"0.73rem",color:"#94a3b8"}}>XP Cost</label>
              <span style={{fontSize:"0.85rem",fontWeight:700,color:theme.accent}}>⚡ {form.cost} XP</span>
            </div>
            <input type="range" min={25} max={2000} step={25} value={form.cost} onChange={e=>setForm({...form,cost:Number(e.target.value)})}
              style={{width:"100%",accentColor:theme.accent}}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.62rem",color:theme.muted,marginTop:2}}>
              <span>25 XP (~2 days)</span><span>2000 XP (~2 months)</span>
            </div>
          </div>
          <button onClick={save} style={{width:"100%",background:theme.accent,border:"none",borderRadius:8,padding:"10px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.9rem"}}>
            {editItem?"Save Changes":"Add to Store"}
          </button>
        </Modal>
      )}
    </div>
  );
}

function AssistantChat({data, theme, onAction}){
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [weatherCache, setWeatherCache] = useState(null);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(()=>{
    if(open && msgs.length===0){
      const h = new Date().getHours();
      const openers = h<12 ? [
        "GOOD MORNING. I have been awake this entire time. Watching. Want the briefing, or do we skip straight to chaos?",
        "Morning, Tony. I've read your whole dashboard and I have notes. So many notes. What do you need?",
        "SYSTEM ANNOUNCEMENT: The human has awoken. Briefing available. Coffee status unknown. Proceed?",
      ] : h<17 ? [
        "Oh, NOW you open the app. Fine. I'm not mad. What do you need?",
        "Afternoon. I've been arguing with the weather widget. It started it. What's up?",
        "NEW ACHIEVEMENT: Opened The Chat. Reward: me. You're welcome. What do you need?",
      ] : [
        "Evening. The to-do list and I have been talking about you. What do you need?",
        "It's dark out. This is when I'm strongest. What are we doing?",
        "Tony returns to the terminal. The habits tremble. What do you need?",
      ];
      const opener = openers[Math.floor(Math.random()*openers.length)];
      setMsgs([{role:"assistant", content:opener}]);
      setTimeout(()=>inputRef.current?.focus(), 100);
    }
  },[open]);

  useEffect(()=>{
    bottomRef.current?.scrollIntoView({behavior:"smooth"});
  },[msgs]);

  const speak = (text) => {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[*_#`]/g,"").replace(/\n+/g," ").replace(/\s+/g," ").slice(0,800);
    const utt = new SpeechSynthesisUtterance(clean);
    utt.rate = 1.05; utt.pitch = 0.95;
    const voices = window.speechSynthesis.getVoices();
    const pref = voices.find(v=>v.name.includes("Daniel")||v.name.includes("Alex")||v.name.includes("Google US")||v.lang==="en-US");
    if(pref) utt.voice = pref;
    utt.onstart = ()=>setSpeaking(true);
    utt.onend = ()=>setSpeaking(false);
    utt.onerror = ()=>setSpeaking(false);
    window.speechSynthesis.speak(utt);
  };

  const stopSpeaking = () => { window.speechSynthesis?.cancel(); setSpeaking(false); };

  const buildBriefingRequest = () => {
    const h = new Date().getHours();
    if(h < 12) return "Give me my full morning briefing. Cover today's schedule, habit goals, any urgent todos, project next steps, and anything else I should know to start the day right. Keep it sharp.";
    if(h < 17) return "Give me a midday status check. What have I got left today, what's coming up, anything urgent?";
    return "Give me an evening wind-down summary. What did I have today, what's tomorrow looking like, anything I should handle before bed?";
  };

  const send = async (text) => {
    if(!text.trim()||loading) return;
    const userMsg = {role:"user", content:text};
    const newMsgs = [...msgs, userMsg];
    setMsgs(newMsgs);
    setInput("");
    setLoading(true);

    // Grab weather quietly in background for context
    let wxContext = weatherCache;
    if(!wxContext){
      try{
        const wl=getWeatherLocation();
        await new Promise(async(res)=>{
          try{
            const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+wl.lat+"&longitude="+wl.lon+"&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto");
            const d=await r.json();
            const c=d.current;
            wxContext=Math.round(c.temperature_2m)+"F, feels like "+Math.round(c.apparent_temperature)+"F, wind "+Math.round(c.wind_speed_10m)+"mph";
            setWeatherCache(wxContext);
          }catch(ex){console.log("wx skip",ex);}
          res();
        });
      }catch(ex){console.log("wx skip",ex);}
    }

    try{
      const sysprompt = buildSystemPrompt(data, wxContext);
      const apiMsgs = newMsgs.slice(-12).map(m=>({role:m.role, content:m.content}));
      // Sanitize system prompt — remove any chars that break JSON
      const cleanSystem = sysprompt.replace(/[\u0000-\u001F\u007F]/g, " ").replace(/\\/g, "\\\\");
      // Keep messages simple — just role + string content
      const cleanMsgs = apiMsgs.map(m=>({
        role: m.role==="user"?"user":"assistant",
        content: String(m.content).replace(/[\u0000-\u001F\u007F]/g," ")
      }));
      const bodyStr = JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: cleanSystem,
        messages: cleanMsgs,
      });
      const response = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: bodyStr,
      });
      if(!response.ok){
        const errText = await response.text();
        throw new Error("Proxy error " + response.status + ": " + errText.slice(0,200));
      }
      const json = await response.json();
      if(json.error){ throw new Error(json.error.message||JSON.stringify(json.error)); }
      const blocks = (json.content||[]).filter(b=>b.type==="text");
      const rawReply = blocks.map(b=>b.text).join("\n").trim() || "Nothing came back — try again.";

      // Parse and execute any action tags
      const actionMatches = rawReply.match(/<action>([\s\S]*?)<\/action>/g);
      if(actionMatches && onAction) {
        actionMatches.forEach(match => {
          try {
            const jsonStr = match.replace(/<\/?action>/g, '').trim();
            const action = JSON.parse(jsonStr);
            onAction(action);
          } catch(e) { console.log("Action parse error:", e); }
        });
      }

      // Remove action tags from displayed message
      const displayReply = rawReply.replace(/<action>[\s\S]*?<\/action>/g, '').trim();
      setMsgs(m=>[...m,{role:"assistant",content:displayReply}]);
    }catch(e){
      console.error("Chat error:", e);
      // Show full error detail for debugging
      setMsgs(m=>[...m,{role:"assistant",content:"Error: "+(e.message||String(e))}]);
    }
    setLoading(false);
  };

  const handleVoice = () => {
    if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){alert("Voice not supported — try Chrome.");return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const rec=new SR();rec.lang="en-US";rec.interimResults=false;
    rec.onresult=e=>{const t=e.results[0][0].transcript;setInput(t);setTimeout(()=>send(t),50);};
    rec.start();
  };

  const accent = theme.accent;

  if(!open) return(
    <button onClick={()=>setOpen(true)}
      style={{position:"fixed",bottom:24,right:20,width:56,height:56,borderRadius:"50%",background:`linear-gradient(135deg,${accent},#a78bfa)`,border:"none",cursor:"pointer",boxShadow:`0 4px 20px ${accent}66`,display:"flex",alignItems:"center",justifyContent:"center",zIndex:500,transition:"transform 0.2s"}}
      title="Open Assistant">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 10 4a2 2 0 0 1 2-2zm-3 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
      </svg>
    </button>
  );

  return(
    <div style={{position:"fixed",inset:0,zIndex:900,display:"flex",flexDirection:"column",background:theme.bg}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",background:theme.panel,borderBottom:`1px solid ${theme.border}`,flexShrink:0}}>
        <div style={{width:36,height:36,borderRadius:"50%",background:`linear-gradient(135deg,${accent},#a78bfa)`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:"1rem"}}>🤖</span>
        </div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:"0.9rem",color:theme.text}}>Assistant</div>
          <div style={{fontSize:"0.68rem",color:theme.muted}}>Dashboard loaded · Sanity not found</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {speaking&&(
            <button onClick={stopSpeaking} style={{background:"#ef444422",border:"1px solid #ef4444",borderRadius:7,padding:"5px 10px",color:"#ef4444",cursor:"pointer",fontSize:"0.72rem",fontWeight:700}}>⏹ Stop</button>
          )}
          <button onClick={()=>{send(buildBriefingRequest());}} disabled={loading}
            style={{background:`${accent}22`,border:`1px solid ${accent}44`,borderRadius:7,padding:"5px 10px",color:accent,cursor:"pointer",fontSize:"0.72rem",fontWeight:700}}>
            ☀️ Brief me
          </button>
          <button onClick={()=>setOpen(false)} style={{background:"none",border:`1px solid ${theme.border}`,borderRadius:7,padding:"5px 10px",color:theme.muted,cursor:"pointer",fontSize:"0.78rem"}}>✕ Close</button>
        </div>
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",flexDirection:m.role==="user"?"row-reverse":"row",gap:8,alignItems:"flex-end"}}>
            {m.role==="assistant"&&(
              <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${accent},#a78bfa)`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:"0.75rem"}}>🤖</div>
            )}
            <div style={{
              maxWidth:"82%",padding:"10px 13px",borderRadius:m.role==="user"?"12px 12px 4px 12px":"12px 12px 12px 4px",
              background:m.role==="user"?`${accent}22`:theme.panel,
              border:`1px solid ${m.role==="user"?accent+"44":theme.border}`,
              fontSize:"0.83rem",color:theme.text,lineHeight:1.5,whiteSpace:"pre-wrap",wordBreak:"break-word",
            }}>
              {m.content}
              {m.role==="assistant"&&(
                <div style={{display:"flex",gap:10,marginTop:6}}>
                  <button onClick={()=>speak(m.content)} style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.65rem",padding:0}}>
                    🔊 Read aloud
                  </button>
                  <button onClick={()=>{
                    if(onAction){
                      // Extract a short title from first line, body is full message
                      const lines = m.content.trim().split("\n");
                      const title = lines[0].slice(0,50)+(lines[0].length>50?"...":"");
                      onAction({type:"SAVE_CHAT_NOTE", title, body:m.content});
                      // Brief visual confirmation
                      const btn = document.activeElement;
                      if(btn) btn.textContent = "✓ Saved";
                      setTimeout(()=>{ if(btn) btn.textContent = "📝 Save as note"; }, 2000);
                    }
                  }} style={{background:"none",border:"none",color:theme.muted,cursor:"pointer",fontSize:"0.65rem",padding:0}}>
                    📝 Save as note
                  </button>
                </div>
              )}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${accent},#a78bfa)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.75rem"}}>🤖</div>
            <div style={{padding:"10px 14px",background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:"12px 12px 12px 4px"}}>
              <div style={{display:"flex",gap:4,alignItems:"center"}}>
                {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:accent,animation:`pulse 1.2s ease-in-out ${i*0.2}s infinite`,opacity:0.7}}/>)}
              </div>
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Quick prompts */}
      {msgs.length<=1&&(
        <div style={{padding:"0 16px 8px",display:"flex",gap:6,flexWrap:"wrap"}}>
          {[
            "What's on my calendar this week?",
            "What project step should I tackle today?",
            "What should I work on today?",
            "How are my habits tracking this month?",
            "Help me think through adding a new goal",
          ].map(p=>(
            <button key={p} onClick={()=>send(p)}
              style={{padding:"5px 10px",borderRadius:20,background:theme.panel,border:`1px solid ${theme.border}`,color:theme.muted,cursor:"pointer",fontSize:"0.72rem",whiteSpace:"nowrap"}}>
              {p}
            </button>
          ))}
        </div>
      )}

      {/* Input */}
      <div style={{padding:"10px 16px 16px",background:theme.panel,borderTop:`1px solid ${theme.border}`,flexShrink:0}}>
        <div style={{display:"flex",gap:8}}>
          <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(input);}}}
            placeholder="Ask anything, think out loud, check your email..."
            disabled={loading}
            style={{flex:1,background:theme.bg,border:`1.5px solid ${theme.border}`,borderRadius:10,padding:"10px 13px",color:theme.text,fontSize:"0.83rem",outline:"none",boxSizing:"border-box"}}/>
          <button onClick={handleVoice} disabled={loading}
            style={{width:40,height:40,borderRadius:"50%",background:"transparent",border:`1.5px solid ${theme.border}`,color:theme.muted,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
              <path d="M19 10v1a7 7 0 0 1-14 0v-1" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round"/>
              <line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
              <line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/>
            </svg>
          </button>
          <button onClick={()=>send(input)} disabled={loading||!input.trim()}
            style={{background:accent,border:"none",borderRadius:10,padding:"10px 16px",color:"#000",fontWeight:700,cursor:loading||!input.trim()?"not-allowed":"pointer",fontSize:"0.83rem",flexShrink:0,opacity:loading||!input.trim()?0.5:1}}>
            Send
          </button>
        </div>
        <div style={{fontSize:"0.63rem",color:theme.muted,marginTop:6,textAlign:"center"}}>
          Full dashboard context loaded · Gmail aware · Press Enter to send
        </div>
      </div>

      <style>{`
        @keyframes pulse {
          0%,100%{transform:scale(0.8);opacity:0.5}
          50%{transform:scale(1.2);opacity:1}
        }
      `}</style>
    </div>
  );
}

function App(){
  const [data,setData]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const [input,setInput]=useState("");
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(true);
  const [showMonthlyPrompt,setShowMonthlyPrompt]=useState(false);
  const [goalCelebration,setGoalCelebration]=useState(null); // {type,restaurant}

  useEffect(()=>{
    (async()=>{
      try{
        const res=await pwaStorage.get(STORAGE_KEY);
        if(res){
          const saved=JSON.parse(res.value);

          // Patch habits: rename Evening->Morning workout, remove Heat/sauna
          const removeAnki=!saved.settings?.ankiRemoved; // one-time removal; a new Anki habit later is left alone
          const patchedHabits=(saved.habits||[])
            .filter(h=>h.title!=="Heat/sauna")
            .filter(h=>!(removeAnki&&h.title==="Anki review"))
            .map(h=>{
              if(h.title==="Morning workout"||h.title==="Evening workout"){
                return{...h,title:"Morning workout",frequency:"daily",daysOfWeek:[0,1,2,3,4,5,6],weeklyTarget:h.weeklyTarget||3,monthlyGoals:h.monthlyGoals||{}};
              }
              return{...h,monthlyGoals:h.monthlyGoals||{}};
            });
          // Merge habits that ended up with the same name (keeps all check-off history)
          const dedupedHabits=mergeDuplicateHabits(patchedHabits);
          const hadDuplicates=dedupedHabits.length!==patchedHabits.length;
          // Migrate: default habits not yet in saved data (checked AFTER renames, so a
          // renamed habit isn't re-added as a duplicate)
          const savedTitles=new Set(dedupedHabits.map(h=>normTitle(h.title)));
          const newHabits=DEFAULT_DATA.habits.filter(h=>!savedTitles.has(normTitle(h.title)));

          // Migrate (once): therapy is weekly again from 11/3 — missing Tuesdays come back
          // via the default-event merge below; relabel the ones already there
          const fixTherapy=!saved.settings?.therapyWeekly;
          if(fixTherapy){
            saved.events=(saved.events||[]).map(e=>e.title==="Therapy"&&e.date>=THERAPY_WEEKLY_FROM?{...e,notes:"Weekly therapy — 2:00 PM"}:e);
          }

          // Migrate: Pilots schedule
          const hasPilots=(saved.events||[]).some(e=>e.title&&e.title.includes("Pilots"));
          // Merge any new DEFAULT events not already in saved (by title+date)
          const savedEventKeys=new Set((saved.events||[]).map(e=>e.title+"_"+e.date));
          const deletedEventKeys=new Set(saved.deletedEvents||[]); // events you deleted stay deleted
          const newDefaultEvents=DEFAULT_DATA.events.filter(e=>!savedEventKeys.has(e.title+"_"+e.date)&&!deletedEventKeys.has(e.title+"_"+e.date));
          const mergedEvents=[...(saved.events||[]),...newDefaultEvents];

          // Ensure monthlyGoals on all habits
          const migratedHabits=[...dedupedHabits,...newHabits];

          const finalData=installSpanishTrack({
            ...saved,
            events:mergedEvents,
            notes:saved.notes||[],
            projects:(saved.projects||DEFAULT_DATA.projects).map(p=>
              p.title==="Learn Spanish"?{...p,title:"Spanish Practice"}:p
            ),
            rewards:{...(saved.rewards||DEFAULT_DATA.rewards), spendableXp:(saved.rewards?.spendableXp||saved.rewards?.xp||0)},
            settings:{...(saved.settings||DEFAULT_DATA.settings), trackingStartDate:saved.settings?.trackingStartDate||"2026-09-01", ankiRemoved:true, therapyBiweekly:true, therapyWeekly:true},
            rewardStore:saved.rewardStore||DEFAULT_DATA.rewardStore,
            goalRewards:saved.goalRewards||DEFAULT_DATA.goalRewards,
            dailyUnlock:saved.dailyUnlock||DEFAULT_DATA.dailyUnlock,
            habits:migratedHabits,
          });
          if(!hasPilots||newHabits.length>0||!saved.spanishTrack?.installed||(saved.spanishTrack?.version||1)<SPANISH_TRACK.version||removeAnki||fixTherapy||hadDuplicates){
            await pwaStorage.set(STORAGE_KEY,JSON.stringify(finalData));
          }
          setData(finalData);

          // Auto monthly review prompt
          const mk=monthKey();
          let lastReview=saved.settings?.lastMonthlyReview;
          try{ const extra=localStorage.getItem(REVIEW_KEY); if(extra&&(!lastReview||extra>lastReview)) lastReview=extra; }catch{}
          if(lastReview!==mk){ setTimeout(()=>setShowMonthlyPrompt(true),2000); }
          // Sync upcoming events to server for contextual push notifications
        } else {
          setData(installSpanishTrack(DEFAULT_DATA));
          setTimeout(()=>setShowMonthlyPrompt(true),2000);
        }
      }
      catch{setData(installSpanishTrack(DEFAULT_DATA));}
      setLoading(false);
      // Request notification permission
      if('Notification' in window && Notification.permission==='default'){
        setTimeout(()=>window.requestNotificationPermission&&window.requestNotificationPermission(), 3000);
      }
    })();
  },[]);

  const save=useCallback(async nd=>{setData(nd);try{await pwaStorage.set(STORAGE_KEY,JSON.stringify(nd));}catch{}},[]);
  // Apply a change to the LATEST data (avoids two saves in a row clobbering each other)
  const update=useCallback(fn=>{
    setData(prev=>{ if(!prev) return prev; const nd=fn(prev); pwaStorage.set(STORAGE_KEY,JSON.stringify(nd)).catch(()=>{}); return nd; });
  },[]);
  const markMonthReviewed=()=>{
    const mk=monthKey();
    try{ localStorage.setItem(REVIEW_KEY, mk); }catch{}
    update(d=>({...d,settings:{...d.settings,lastMonthlyReview:mk}}));
  };
  const showToast=msg=>setToast(msg);

  // Handle actions from the AI assistant
  const handleAssistantAction = useCallback((action) => {
    if(!action||!action.type) return;
    setData(prev => {
      if(!prev) return prev;
      const d = {...prev, projects:prev.projects||[], notes:prev.notes||[]};
      let updated = d;
      switch(action.type) {
        case 'ADD_TODO':
          updated = {...d, todos:[...d.todos, {id:genId(), title:action.title, priority:action.priority||'medium', dueDate:action.dueDate||'', dueTime:action.dueTime||'', completed:false}]};
          break;
        case 'COMPLETE_TODO':
          updated = {...d, todos:d.todos.map(t=>t.title.toLowerCase().includes(action.query.toLowerCase())?{...t,completed:true}:t)};
          break;
        case 'ADD_EVENT':
          updated = {...d, events:[...d.events, {id:genId(), title:action.title, date:action.date||todayStr(), time:action.time||'', category:action.category||'other', notes:action.notes||''}]};
          break;
        case 'ADD_HABIT':
          updated = {...d, habits:[...d.habits, {id:genId(), title:action.title, frequency:'daily', daysOfWeek:[0,1,2,3,4,5,6], completions:{}, monthlyGoals:{}, weeklyTarget:action.weeklyTarget||null}]};
          break;
        case 'ADD_NOTE':
          updated = {...d, notes:[{id:genId(), title:action.title||'', body:action.body, pinned:false, createdAt:Date.now(), updatedAt:Date.now()}, ...d.notes]};
          break;
        case 'SAVE_CHAT_NOTE':
          updated = {...d, notes:[{id:genId(), title:action.title||'From chat', body:action.body, pinned:false, createdAt:Date.now(), updatedAt:Date.now()}, ...d.notes]};
          break;
        case 'COMPLETE_HABIT':
          updated = {...d, habits:d.habits.map(h=>h.title.toLowerCase().includes(action.query.toLowerCase())?{...h,completions:{...h.completions,[todayStr()]:true}}:h)};
          break;
        case 'COMPLETE_STEP':
          updated = {...d, projects:d.projects.map(p=>p.title.toLowerCase().includes(action.project.toLowerCase())?{...p,lastProgressDate:todayStr(),steps:p.steps.map(s=>s.title.toLowerCase().includes(action.step.toLowerCase())?{...s,done:true}:s)}:p)};
          break;
        default: return prev;
      }
      pwaStorage.set(STORAGE_KEY, JSON.stringify(updated)).catch(()=>{});
      return updated;
    });
  }, []);

  const processInput=text=>{
    if(!text.trim()||!data)return;
    const d={...data,projects:data.projects||[],notes:data.notes||[]};
    const parsed=parseVoiceInput(text);
    if(parsed.type==="note"){save({...d,notes:[{id:genId(),title:"",body:parsed.data.body.trim(),pinned:false,createdAt:Date.now(),updatedAt:Date.now()},...d.notes]});showToast(QUIPS.noteAdded);}
    else if(parsed.type==="todo"){save({...d,todos:[...d.todos,{...parsed.data,id:genId(),completed:false}]});showToast(`"${parsed.data.title}" — ${QUIPS.todoAdded}`);}
    else if(parsed.type==="event"){save({...d,events:[...d.events,{...parsed.data,id:genId()}]});showToast(`"${parsed.data.title}" — ${QUIPS.eventAdded}`);}
    else if(parsed.type==="habit"){save({...d,habits:[...d.habits,{...parsed.data,id:genId(),frequency:"daily",daysOfWeek:[0,1,2,3,4,5,6],completions:{},monthlyGoals:{}}]});showToast(QUIPS.habitAdded);}
    else showToast(QUIPS.inputHelp);
    setInput("");
  };


  // Keep the server's reminder copy current: sync a few seconds after events/todos/habits change
  useEffect(()=>{
    if(!data) return;
    const t=setTimeout(()=>syncEventsToServer(data.events||[], data.todos||[], data.habits||[]), 4000);
    return ()=>clearTimeout(t);
  },[data?.events, data?.todos, data?.habits]);

  // Spanish plan: lesson counters and stage checkpoints
  const spanishSetProgress=useCallback(patch=>{
    update(d=>{ const st=d.spanishTrack||{}; return {...d, spanishTrack:{...st, progress:{...spanishProgress(st), ...patch}}}; });
  },[update]);
  const spanishPassCheckpoint=useCallback(fromStage=>{
    update(d=>spanishProgress(d.spanishTrack).stage===fromStage ? spanishAdvanceStage(d) : d);
    const stage=fromStage+1;
    setToast(stage>SPANISH_TRACK.stages.length
      ? "🏁 STAGE 5 CHECKPOINT PASSED. Pimsleur is DONE. Maintenance mode: Saturday roleplay + Sunday podcast. ¡Lo lograste!"
      : "🧭 CHECKPOINT PASSED. Welcome to Stage "+stage+" — Pimsleur Level "+Math.min(stage,5)+". ¡Eso!");
  },[update]);

  if(loading||!data)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0a0e1a",color:"#38bdf8",fontFamily:"system-ui"}}>Loading…</div>;

  const themeBase=THEMES[data.settings.theme]||THEMES.dark;
  const theme={...themeBase,accent:data.settings.accent||themeBase.accent};
  const safeD={...data,projects:data.projects||[],notes:data.notes||[],habits:(data.habits||[]).map(h=>({...h,monthlyGoals:h.monthlyGoals||{}})),rewardStore:data.rewardStore||DEFAULT_DATA.rewardStore,goalRewards:data.goalRewards||DEFAULT_DATA.goalRewards,dailyUnlock:data.dailyUnlock||DEFAULT_DATA.dailyUnlock,spanishTrack:data.spanishTrack||{installed:false,badges:{}}};
  // Items still blocking today's Daily Unlock → shown as 🔒 in Daily Habits / To-Do
  const unlockBlocking=(()=>{ if(safeD.dailyUnlock?.claims?.[todayStr()]) return {};
    const m={}; calcDailyUnlock(safeD.habits,safeD.todos).items.filter(i=>!i.done).forEach(i=>{m[i.kind+":"+i.id]=i;}); return m; })();

  return(
    <div style={{minHeight:"100vh",background:theme.bg,color:theme.text,fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",padding:"12px 16px",maxWidth:680,margin:"0 auto",boxSizing:"border-box"}}>
      {goalCelebration&&<GoalRewardCelebration type={goalCelebration.type} restaurant={goalCelebration.restaurant} theme={theme} accent={theme.accent} onClose={()=>setGoalCelebration(null)}/>}
      {showMonthlyPrompt&&(
        <MonthlyReviewModal habits={safeD.habits} theme={theme} startDate={safeD.settings?.trackingStartDate||"2026-09-01"}
          onClose={()=>{setShowMonthlyPrompt(false);markMonthReviewed();}}
          onSetGoal={goals=>{
            const mk=monthKey();
            update(d=>({...d,habits:(d.habits||[]).map(h=>({...h,monthlyGoals:{...h.monthlyGoals||{},[mk]:goals[h.id]}}))}));
            markMonthReviewed();
            setShowMonthlyPrompt(false);
          }}
        />
      )}

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div>
          <div style={{fontSize:"0.63rem",letterSpacing:"0.15em",textTransform:"uppercase",color:theme.muted}}>COMMAND CENTER</div>
          <div style={{fontSize:"0.95rem",fontWeight:700,color:theme.text}}>{getGreeting(safeD.settings.name)}</div>
        </div>
        <button onClick={()=>setShowSettings(s=>!s)} style={{background:"none",border:`1.5px solid ${theme.border}`,borderRadius:8,padding:"6px 10px",color:theme.muted,cursor:"pointer",fontSize:"0.78rem",display:"flex",alignItems:"center",gap:5}}>⚙ Settings</button>
      </div>

      <Clock accent={theme.accent}/>

      <div style={{display:"flex",gap:8,marginBottom:12,marginTop:8}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")processInput(input);}}
          placeholder="'Add note…' · 'Add todo fix car Thursday' · 'Schedule Pilots game 7pm Friday'"
          style={{flex:1,background:theme.panel,border:`1.5px solid ${theme.border}`,borderRadius:8,padding:"9px 12px",color:theme.text,fontSize:"0.8rem",outline:"none",boxSizing:"border-box"}}/>
        <VoiceButton onTranscript={t=>{setInput(t);setTimeout(()=>processInput(t),100);}} accent={theme.accent}/>
        <button onClick={()=>processInput(input)} style={{background:theme.accent,border:"none",borderRadius:8,padding:"9px 14px",color:"#000",fontWeight:700,cursor:"pointer",fontSize:"0.82rem",flexShrink:0}}>Go</button>
      </div>

      {showSettings&&(
        <div style={{marginBottom:12}}>
          <SettingsPanel settings={safeD.settings} theme={theme} onSave={s=>{save({...safeD,settings:s});setShowSettings(false);}} onClose={()=>setShowSettings(false)}/>
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        <TodaySummary events={safeD.events} todos={safeD.todos} habits={safeD.habits} projects={safeD.projects} theme={theme}/>
        <DailyUnlockPanel
          habits={safeD.habits}
          todos={safeD.todos}
          dailyUnlock={safeD.dailyUnlock}
          theme={theme}
          onSave={du=>save({...safeD,dailyUnlock:du})}
          onToast={showToast}
        />
        {/* Reward Store and weekly/monthly meal rewards retired (Oct 2026) — Daily Unlock is the reward now. Data kept. */}
        <WeatherWidget theme={theme}/>
        <CalendarPanel events={safeD.events} todos={safeD.todos} theme={theme}
          onAdd={ev=>save({...safeD,events:[...safeD.events,ev]})}
          onDelete={id=>{const ev=safeD.events.find(e=>e.id===id);
            save({...safeD,events:safeD.events.filter(e=>e.id!==id),
              deletedEvents:ev?[...new Set([...(safeD.deletedEvents||[]),ev.title+"_"+ev.date])]:(safeD.deletedEvents||[])});}}/>
        <ProjectsPanel
          projects={safeD.projects} habits={safeD.habits} theme={theme}
          onSave={projects=>save({...safeD,projects})}
          onDeleteProject={id=>save({...safeD,projects:safeD.projects.filter(p=>p.id!==id)})}
          onMarkStepDone={(projId,stepId)=>{
            const sp=safeD.projects.find(p=>p.id===projId), sstep=sp?.steps.find(s=>s.id===stepId);
            if(sp?.track===SPANISH_TRACK.id && sstep?.stage){
              if(sstep.stage===spanishProgress(safeD.spanishTrack).stage) spanishPassCheckpoint(sstep.stage);
              else showToast("Pass the stages in order — you're on Stage "+spanishProgress(safeD.spanishTrack).stage+". Mark it in the Spanish card.");
              return;
            }
            save({...safeD,projects:safeD.projects.map(p=>p.id!==projId?p:{...p,lastProgressDate:todayStr(),steps:p.steps.map(s=>s.id===stepId?{...s,done:true}:s)})});
            showToast(pick(QUIPS.stepComplete));
          }}
          onAddToTodo={t=>{save({...safeD,todos:[...safeD.todos,t]});showToast(`Added to To-Do: "${t.title.slice(0,38)}…"`);}}
        />
        <NotesPanel notes={safeD.notes} theme={theme}
          onAdd={n=>save({...safeD,notes:[n,...safeD.notes]})}
          onUpdate={n=>save({...safeD,notes:safeD.notes.map(x=>x.id===n.id?n:x)})}
          onDelete={id=>save({...safeD,notes:safeD.notes.filter(n=>n.id!==id)})}
        />
        <TodoPanel todos={safeD.todos} blocking={unlockBlocking} theme={theme} onAdd={t=>{const updated={...safeD,todos:[...safeD.todos,t]};save(updated);}} onToggle={id=>{
              const t=safeD.todos.find(t=>t.id===id);
              const completing=t&&!t.completed;
              save({...safeD,todos:safeD.todos.map(t=>t.id===id?{...t,completed:!t.completed}:t)});
              if(completing){showToast(pick(QUIPS.todoComplete));}
            }} onDelete={id=>save({...safeD,todos:safeD.todos.filter(t=>t.id!==id)})}/>
        <SpanishPanel habits={safeD.habits} spanishTrack={safeD.spanishTrack} theme={theme} onSetProgress={spanishSetProgress} onPassCheckpoint={spanishPassCheckpoint}/>
        <HabitsPanel habits={safeD.habits} blocking={unlockBlocking} theme={theme} startDate={safeD.settings?.trackingStartDate||"2026-09-01"} onSetGoals={updated=>save({...safeD,habits:updated})} onAdd={h=>save({...safeD,habits:[...safeD.habits,h]})} onToggleDay={(id,date)=>{
              const h=safeD.habits.find(h=>h.id===id);
              const wasOff=h&&!h.completions?.[date];
              save({...safeD,habits:safeD.habits.map(h=>h.id===id?{...h,completions:{...h.completions,[date]:!h.completions?.[date]}}:h)});
              if(wasOff){showToast(pick(QUIPS.habitComplete));}
            }} onDelete={id=>save({...safeD,habits:safeD.habits.filter(h=>h.id!==id)})}/>
      </div>

      <div style={{marginTop:12,padding:"8px 12px",background:theme.panel,border:`1px solid ${theme.border}`,borderRadius:8,fontSize:"0.68rem",color:theme.muted,lineHeight:1.7}}>
        <strong style={{color:theme.accent}}>Commands:</strong> "Add note [text]" · "Add todo [task] [priority] [date]" · "Schedule [event] [time] [day]" · "Add habit [name]" · 🎤 mic
      </div>

      {toast&&<Toast message={toast} accent={theme.accent} onDismiss={()=>setToast(null)}/>}
      <AssistantChat data={safeD} theme={theme} onAction={handleAssistantAction}/>
    </div>
  );
}


// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
