[build]
  publish = "."
  functions = "netlify/functions"

# Scheduled functions — Netlify syntax is [functions."<file name>"] schedule = "<cron>".
# Cron runs in UTC; functions that need a Pacific time are scheduled at both
# possible UTC hours and skip the run that isn't the right Pacific time.
[functions."evening-checkin"]
  schedule = "0 3,4 * * *"       # 8pm Pacific: 03:00 UTC (PDT) / 04:00 UTC (PST)

[functions."check-reminders"]
  schedule = "*/30 * * * *"      # every 30 minutes

[functions."fantasy-thursday"]
  schedule = "30 0,23 * * 4,5"   # Thu 4:30pm Pacific: Thu 23:30 UTC (PDT) / Fri 00:30 UTC (PST)

[functions."fantasy-sunday"]
  schedule = "30 16,17 * * 0"    # Sun 9:30am Pacific: 16:30 UTC (PDT) / 17:30 UTC (PST)

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
