[build]
  publish = "."
  functions = "netlify/functions"

[[scheduled-functions]]
  name = "notify"
  schedule = "0 3 * * *"  # 8pm Pacific Daylight Time = 3:00 UTC

[[scheduled-functions]]
  name = "check-reminders"
  schedule = "*/30 * * * *"  # Every 30 minutes

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
